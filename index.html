<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yalla Guys">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%230B7A75'/%3E%3Ctext x='50' y='70' font-size='58' text-anchor='middle' font-family='Arial' font-weight='900' fill='white'%3EY%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: phone-first single column app shell — sticky header, scrolling view, fixed bottom tab bar, full-screen sheets that slide up. Centered 560px column on desktop. */
:root{
  --bg:#EEF1F4;--surface:#FFFFFF;--surface2:#E4E8ED;--fg:#111820;--muted:#5C6774;--line:#D5DBE2;
  --accent:#0B7A75;--accent-fg:#FFFFFF;--accent-soft:#D3EEEC;--sun:#C9661A;--sun-soft:#FBE6D2;
  --danger:#C2372F;--danger-soft:#F8DEDC;--ok:#2F8F4E;--warn:#A86A12;--warn-soft:#F7EACF;
  --land:#E9E2D0;--land-line:#C9BFA6;--sea:#CFE3EA;--shadow:0 6px 24px rgba(17,24,32,.12);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  --r:14px;--tabh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1318;--surface:#161D24;--surface2:#1F2830;--fg:#E9EEF2;--muted:#93A0AD;--line:#2A343E;
  --accent:#3CC0B7;--accent-fg:#04201E;--accent-soft:#12332F;--sun:#F29A4A;--sun-soft:#3A2716;
  --danger:#F06A60;--danger-soft:#3A1A18;--ok:#5CC27E;--warn:#E0A84A;--warn-soft:#3A2C12;
  --land:#26302B;--land-line:#3C4A42;--sea:#0F1D24;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1318;--surface:#161D24;--surface2:#1F2830;--fg:#E9EEF2;--muted:#93A0AD;--line:#2A343E;
  --accent:#3CC0B7;--accent-fg:#04201E;--accent-soft:#12332F;--sun:#F29A4A;--sun-soft:#3A2716;
  --danger:#F06A60;--danger-soft:#3A1A18;--ok:#5CC27E;--warn:#E0A84A;--warn-soft:#3A2C12;
  --land:#26302B;--land-line:#3C4A42;--sea:#0F1D24;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;flex:1;min-width:0}
.brand span{color:var(--accent);margin-left:2px}
.me-btn{border:0;background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 0 var(--line);font-weight:600;font-size:14px;min-height:40px}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:16px;flex:none;color:#fff;font-weight:700}
.av.sm{width:26px;height:26px;font-size:13px}
.av.xs{width:22px;height:22px;font-size:11px}
.stack{display:flex}.stack .av{margin-left:-7px;border:2px solid var(--surface)}.stack .av:first-child{margin-left:0}
.banner{margin-block:4px 10px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--fg);font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="true"]{color:var(--accent)}
.badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--danger);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.view-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-block:6px 12px}
.view-title h1{font-size:30px;font-weight:800}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-weight:600;font-size:13px;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.pcard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;overflow:hidden;padding:0}
.pcard .cover{height:118px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;padding:10px 12px}
.pcard .cover .emo{font-size:40px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.pcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.pcard h3{font-size:19px;font-weight:700}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.meta{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.vote{background:var(--sun-soft);color:var(--sun)}
.pill.set{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--surface2);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.fab{position:fixed;z-index:25;right:max(16px,calc((100vw - 560px)/2 + 16px),env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px);border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:16px;border-radius:999px;padding:0 20px;height:54px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.fab b{font-size:24px;line-height:1;font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:14px}
a.btn{color:var(--fg)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sun{background:var(--sun);color:#fff;border-color:var(--sun)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.empty{padding:28px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty h3{color:var(--fg);font-size:18px;margin-bottom:6px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;min-height:46px;color:var(--fg)}
textarea.inp{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:8px}
.grid2>*,.grid3>*{min-width:0}
.form{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:10px;padding-block:16px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec h2{font-size:18px;font-weight:700}
.sec .hint{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.emo-pick{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.emo-pick button{flex:none;width:46px;height:46px;font-size:24px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.emo-pick button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:50%;font-size:18px;flex:none}
.num{font-variant-numeric:tabular-nums}
/* sheets */
#sheets .sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheets .sheet{animation:none}}
.sheet-h{flex:none;display:flex;align-items:center;gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;border-bottom:1px solid var(--line);background:var(--bg)}
.sheet-h .in{max-width:560px;margin:0 auto;width:100%;display:flex;align-items:center;gap:8px}
.sheet-h h2{flex:1;font-size:18px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.sheet-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-b .in{max-width:560px;margin:0 auto;padding-block:12px calc(env(safe-area-inset-bottom,0px) + 32px)}
.sheet-f{flex:none;border-top:1px solid var(--line);background:var(--surface);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding-top:10px}
.sheet-f .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
/* plan detail */
.hero{border-radius:18px;min-height:150px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:14px;position:relative;overflow:hidden}
.hero .emo{font-size:52px;line-height:1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.35))}
.hero .emo{position:relative;z-index:1}
.when{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--accent-soft)}
.when .d{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent);line-height:1.1}
.cal-ic{flex:none;width:54px;border-radius:10px;overflow:hidden;background:var(--surface);text-align:center;border:1px solid var(--line)}
.cal-ic .m{background:var(--sun);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 0}
.cal-ic .dd{font-family:var(--f-display);font-size:24px;font-weight:800;padding:2px 0 4px}
.slot{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.slot.mine{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.vote-btn{border:2px solid var(--line);background:var(--surface);border-radius:10px;width:44px;height:44px;flex:none;font-size:20px;display:grid;place-items:center}
.vote-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.media-grid>*{aspect-ratio:1;border-radius:10px;overflow:hidden;border:0;padding:0;background:var(--surface2);position:relative;min-width:0}
.media-grid img{width:100%;height:100%;object-fit:cover;display:block}
.reel{display:flex;flex-direction:column;justify-content:space-between;padding:8px;text-align:left;color:#fff;background:linear-gradient(160deg,#833AB4,#E1306C 55%,#F77737);text-decoration:none;font-size:12px;font-weight:600}
.reel.lnk{background:linear-gradient(160deg,#0B7A75,#13506F)}
.reel .play{font-size:22px}
.reel .cap{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.add-tile{display:grid;place-items:center;color:var(--accent);font-weight:700;font-size:13px;border:2px dashed var(--line)!important;background:var(--surface)!important}
.mini-map,.map-full{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
.mini-map{height:220px}
.leg{display:flex;gap:10px;align-items:flex-start}
.leg .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.leg .eta{font-size:12px;color:var(--muted);padding:4px 0 6px 36px;border-left:2px dotted var(--line);margin-left:12px;padding-left:22px}
.note{padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;gap:10px}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.danger-zone{display:flex;gap:8px;flex-wrap:wrap}
/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 8px}
.cal-h h2{font-size:20px;font-weight:800}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-g .dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;letter-spacing:.06em}
.day{border:0;background:none;border-radius:10px;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:3px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.day.out{color:var(--muted);opacity:.45}
.day.today .dn{background:var(--sun);color:#fff}
.day .dn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.day[aria-pressed="true"]{background:var(--accent-soft)}
.dots{display:flex;gap:2px;height:6px}
.dots i{width:6px;height:6px;border-radius:50%}
.dot-plan{background:var(--accent)}.dot-poll{border:1.5px solid var(--sun);box-sizing:border-box}.dot-me{background:var(--fg)}.dot-oth{background:var(--muted);opacity:.6}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 4px 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ev{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);align-items:center;text-align:left;width:100%}
.ev .tm{flex:none;width:66px;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .stripe{width:4px;align-self:stretch;border-radius:4px;flex:none}
.ev.busy .stripe{background:repeating-linear-gradient(45deg,var(--muted) 0 3px,transparent 3px 6px)}
/* map */
.map-full{height:calc(100dvh - 260px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:300px}
.leaflet-container{background:var(--sea);font-family:var(--f-body)}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin b{transform:rotate(45deg);color:#fff;font-size:13px;font-weight:800}
.pin-new{background:var(--danger)}
.plabel{background:none;border:0;box-shadow:none;color:var(--muted);font-size:10px;font-weight:600;white-space:nowrap}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--fg)}
.leaflet-popup-content{margin:10px 12px;font-size:13px}
.leaflet-bar a{background:var(--surface)!important;color:var(--fg)!important;border-color:var(--line)!important;width:36px!important;height:36px!important;line-height:36px!important}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.sugg button{border:0;background:none;text-align:left;padding:11px 12px;border-top:1px solid var(--line);min-height:44px}
.sugg button:first-child{border-top:0}
/* chat */
.chat-row{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;text-align:left}
.chat-row .grow{flex:1;min-width:0}
.chat-row .last{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gav{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--accent-soft)}
.msgs{display:flex;flex-direction:column;gap:4px}
.msg{max-width:80%;display:flex;flex-direction:column;gap:2px;align-items:flex-start;align-self:flex-start}
.msg .bub{padding:8px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.msg .who{font-size:11px;color:var(--muted);font-weight:600;padding:0 6px}
.daysep{align-self:center;font-size:11px;font-weight:700;color:var(--muted);padding:10px 0 4px;letter-spacing:.06em;text-transform:uppercase}
.compose{flex:1;border:1px solid var(--line);border-radius:22px;padding:10px 14px;font-size:16px;min-height:44px;max-height:120px;background:var(--bg);resize:none}
.send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
/* money */
.money-hero{padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.money-hero .big{font-family:var(--f-display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.pos{color:var(--ok)}.neg{color:var(--danger)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.check{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:46px}

.vis-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}

body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}

const fMin=m=>m<60?`${m} min`:`${Math.floor(m/60)}h ${pad(m%60)}m`;
function gmapsUrl(stops){
  const p=stops.filter(s=>s.lat!=null);
  if(!p.length)return stops[0]?.link||"";
  const ll=s=>`${s.lat},${s.lng}`;
  if(p.length===1)return`https://www.google.com/maps/search/?api=1&query=${ll(p[0])}`;
  const w=p.slice(1,-1).map(ll).join("|");
  return`https://www.google.com/maps/dir/?api=1&origin=${ll(p[0])}&destination=${ll(p[p.length-1])}${w?"&waypoints="+encodeURIComponent(w):""}&travelmode=driving`;
}
const ROUTES=new Map(ls.get("yg-routes",[]));
function routeFor(stops){
  const pts=(stops||[]).filter(s=>s.lat!=null);if(pts.length<2)return null;
  const sig=pts.map(p=>(+p.lat).toFixed(5)+","+(+p.lng).toFixed(5)).join(";");const c=ROUTES.get(sig);
  if(c&&c!=="pending")return c==="fail"?null:c;
  if(!c&&navigator.onLine!==false){ROUTES.set(sig,"pending");
    fetch(`https://router.project-osrm.org/route/v1/driving/${pts.map(p=>p.lng+","+p.lat).join(";")}?overview=simplified&geometries=geojson`).then(r=>r.json()).then(j=>{
      if(j.code!=="Ok"||!j.routes?.[0])throw 0;const r=j.routes[0];
      ROUTES.set(sig,{km:r.distance/1000,min:Math.round(r.duration/60),legs:r.legs.map(l=>({km:l.distance/1000,min:Math.round(l.duration/60)})),coords:r.geometry.coordinates.map(([a,b])=>[+b.toFixed(5),+a.toFixed(5)])});
      ls.set("yg-routes",[...ROUTES].filter(([,v])=>typeof v==="object").slice(-40));schedule();
    }).catch(()=>{ROUTES.set(sig,"fail");schedule()});
  }
  return null;
}

  light:{land:"#F5F3EF",land2:"#EEEBE5",water:"#A6D2F4",park:"#CBEAC2",wood:"#BFE2B5",sand:"#F3EBD1",building:"#E6E2DC",bOutline:"#D8D3CC",road:"#FFFFFF",casing:"#D6D9DE",major:"#FFFFFF",majorCase:"#C3C7CD",hwy:"#FAD27E",hwyCase:"#E2A93F",rail:"#C8CCD2",boundary:"#A3A7AE",text:"#4A4F55",textStrong:"#1F2328",halo:"#FFFFFF",waterText:"#3E77AE",poi:"#5F6368"},
  dark:{land:"#1E2530",land2:"#222A35",water:"#0E1A2A",park:"#1C312D",wood:"#1A2E29",sand:"#29291F",building:"#28303B",bOutline:"#313A46",road:"#3A4350",casing:"#1E2631",major:"#4A5463",majorCase:"#27303C",hwy:"#7E6B48",hwyCase:"#3A3225",rail:"#3A4250",boundary:"#5A6270",text:"#9AA4B2",textStrong:"#E4E8ED",halo:"#121820",waterText:"#5D82AB",poi:"#8C96A3"}};
let _baseStyle=null;const _styles={};
const glOK=()=>{try{if(!window.maplibregl||!L.maplibreGL)return false;const c=document.createElement("canvas");return!!(c.getContext("webgl2")||c.getContext("webgl"))}catch{return false}};
function styleFor(dark){
  const k=dark?"dark":"light";if(_styles[k])return _styles[k];
  _baseStyle=_baseStyle||fetch("https://tiles.openfreemap.org/styles/liberty").then(r=>{if(!r.ok)throw new Error("style "+r.status);return r.json()});
  return _styles[k]=_baseStyle.then(base=>{
    const st=JSON.parse(JSON.stringify(base)),c=MAP_PAL[k],EN=["coalesce",["get","name:en"],["get","name_en"],["get","name"]];
    for(const ly of st.layers){const id=ly.id.toLowerCase(),t=ly.type,p=ly.paint=ly.paint||{};
      if(t==="background"){p["background-color"]=c.land;continue}
      if(t==="fill"||t==="fill-extrusion"){const key=t==="fill"?"fill-color":"fill-extrusion-color";delete p["fill-pattern"];
        if(/water|ocean|lake|river|bay/.test(id))p[key]=c.water;
        else if(/park|grass|garden|golf|pitch|cemetery|meadow|recreation/.test(id))p[key]=c.park;
        else if(/wood|forest|scrub|wetland/.test(id))p[key]=c.wood;
        else if(/sand|beach|desert|bare|rock/.test(id))p[key]=c.sand;
        else if(/build/.test(id)){p[key]=c.building;if(t==="fill")p["fill-outline-color"]=c.bOutline;else p["fill-extrusion-opacity"]=.55}
        else p[key]=c.land2;
        continue}
      if(t==="line"){
        if(/water|river|stream|canal|ditch/.test(id))p["line-color"]=c.water;
        else if(/boundary|admin/.test(id))p["line-color"]=c.boundary;
        else if(/rail|transit|subway/.test(id))p["line-color"]=c.rail;
        else if(/road|highway|bridge|tunnel|street|path|track|link/.test(id)){
          const cas=/casing|outline/.test(id),hw=/motorway|trunk/.test(id),mj=/primary|secondary|major/.test(id);
          if(/path|track|pedestrian|steps|cycle|foot/.test(id))p["line-color"]=c.casing;
          else p["line-color"]=cas?(hw?c.hwyCase:mj?c.majorCase:c.casing):(hw?c.hwy:mj?c.major:c.road)}
        else if(/aeroway/.test(id))p["line-color"]=c.land2;
        continue}
      if(t==="symbol"){const lay=ly.layout||{};
        if(lay["text-field"]&&JSON.stringify(lay["text-field"]).includes("name"))lay["text-field"]=EN;
        if(lay["text-field"]){p["text-color"]=/water|ocean|sea|lake|bay/.test(id)?c.waterText:/place|city|country|state|town|capital/.test(id)?c.textStrong:/poi/.test(id)?c.poi:c.text;p["text-halo-color"]=c.halo;p["text-halo-width"]=1.4;p["text-halo-blur"]=.2}}
    }
    return st;
  });
}
function rasterTiles(m,el){L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19}).addTo(m);el.classList.remove("dark-tiles")}
function baseMap(el,opts={}){
  if(!window.L){el.innerHTML='<div class="empty" style="height:100%;display:grid;place-items:center">Map couldn\'t load. Check your connection.</div>';return null}
  const m=L.map(el,{zoomControl:true,attributionControl:true,...opts});
  m.attributionControl.setPrefix(false);
  m.on("unload",()=>m._dead=true);
  if(glOK())styleFor(false).then(st=>{if(m._dead)return;try{L.maplibreGL({style:st,attributionControl:false}).addTo(m)}catch(e){console.error(e);rasterTiles(m,el)}}).catch(e=>{console.error(e);if(!m._dead)rasterTiles(m,el)});
  else rasterTiles(m,el);
  m.attributionControl.addAttribution('<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>');
  m.setView([25.15,55.25],10);
  return m;
}
const pinIcon=(n,color)=>L.divIcon({className:"",html:`<div class="pin" style="background:${color}"><b>${n}</b></div>`,iconSize:[30,30],iconAnchor:[15,30],popupAnchor:[0,-28]});
function drawStops(layer,stops,color,onTap){
  layer.clearLayers();const pts=(stops||[]).filter(s=>s.lat!=null);
  pts.forEach((s,i)=>{const mk=L.marker([s.lat,s.lng],{icon:pinIcon(pts.length>1?i+1:"•",color)}).addTo(layer);if(onTap)onTap(mk,s,i)});
  if(pts.length>1){const r=routeFor(stops);
    if(r)L.polyline(r.coords,{color,weight:5,opacity:.9}).addTo(layer);else L.polyline(pts.map(s=>[s.lat,s.lng]),{color,weight:4,opacity:.7,dashArray:"8 7"}).addTo(layer)}
  return pts;
}
function fit(m,pts){if(!pts.length)return;if(pts.length===1)m.setView([pts[0].lat,pts[0].lng],14);else m.fitBounds(pts.map(p=>[p.lat,p.lng]),{padding:[36,36],maxZoom:15})}
function miniMap(s,key,el,stops,color){
  if(!el)return;s.mms=s.mms||{};let mm=s.mms[key];
  if(!mm){const box=document.createElement("div");box.style.height="100%";el.appendChild(box);const map=baseMap(box,{scrollWheelZoom:false});mm=s.mms[key]={box,map,layer:map&&L.layerGroup().addTo(map)}}
  else el.appendChild(mm.box);
  if(!mm.map)return;
  const r=routeFor(stops),sig=JSON.stringify(stops)+(r?"r":"");
  setTimeout(()=>{mm.map.invalidateSize();if(mm.sig!==sig){const refit=mm.sig?.split("]")[0]!==sig.split("]")[0];mm.sig=sig;const pts=drawStops(mm.layer,stops,color,(mk,x)=>mk.bindPopup(esc(x.name||"Pin")));if(refit||!mm.fitted){fit(mm.map,pts);mm.fitted=true}}},60);
}
function afterView(){
  if(UI.tab!=="plans"||UI.planFilter!=="map")return;
  const slot=$("#mapSlot");if(!slot)return;
  if(!MAPS.main){const el=document.createElement("div");el.className="map-full";MAPS.main={el};slot.appendChild(el);MAPS.main.map=baseMap(el);MAPS.main.layer=MAPS.main.map&&L.layerGroup().addTo(MAPS.main.map)}else slot.appendChild(MAPS.main.el);
  const{map,layer}=MAPS.main;
  const ps=visiblePlans().filter(p=>(p.stops||[]).some(s=>s.lat!=null));
  if(map){setTimeout(()=>map.invalidateSize(),30);layer.clearLayers();const all=[];
    ps.forEach(p=>{const sub=L.layerGroup().addTo(layer);all.push(...drawStops(sub,p.stops,hue(p.id),(mk,s)=>mk.bindPopup(`<b>${esc(p.emoji||"")} ${esc(p.title)}</b><br>${esc(s.name||"")}<br><a href="#" data-act="openPlan" data-id="${esc(p.id)}">Open plan</a>`)))});
    const sig=ps.map(p=>p.id).join();if(MAPS.main.sig!==sig){MAPS.main.sig=sig;fit(map,all)}}
  $("#mapList").innerHTML=ps.length?ps.map(p=>{const r=routeFor(p.stops);return`<button class="ev" data-act="openPlan" data-id="${esc(p.id)}"><span class="stripe" style="background:${hue(p.id)}"></span><span style="flex:1;min-width:0"><b>${esc(p.emoji||"")} ${esc(p.title)}</b><br><span class="meta">${p.stops.map(s=>esc(s.name||"Pin")).join(" → ")}${r?` · ${r.km.toFixed(0)} km · ${fMin(r.min)}`:""}</span></span>${statusPill(p)}</button>`}).join(""):`<div class="empty">No places pinned yet. Add stops when you make a plan.</div>`;
}

const SHEETS={};
let pushed=0,ignorePop=0;
function openSheet(kind,args={}){
  const el=document.createElement("div");el.className="sheet"+(kind==="photo"?" lightbox":"");el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");
  el.innerHTML=`<div class="sheet-h wrap"><div class="in"></div></div><div class="sheet-b wrap"><div class="in"></div></div><div class="sheet-f wrap" hidden><div class="in"></div></div>`;
  const s={kind,args,el,state:SHEETS[kind].init?SHEETS[kind].init(args):{},parts:{}};stack.push(s);$("#sheets").appendChild(el);
  paintSheet(s,true);document.body.style.overflow="hidden";
  try{history.pushState({yg:stack.length},"");pushed++}catch{}
  return s;
}
function closeSheet(viaPop){
  const s=stack.pop();if(!s)return;s.el.remove();Object.values(s.mms||{}).forEach(m=>m.map?.remove());SHEETS[s.kind].destroy?.(s);
  if(!stack.length)document.body.style.overflow="";
  if(!viaPop&&pushed>0){pushed--;ignorePop++;try{history.back()}catch{ignorePop--}}
  schedule();
}
window.addEventListener("popstate",()=>{if(ignorePop>0){ignorePop--;return}if(pushed>0)pushed--;if(stack.length)closeSheet(true)});
function paintSheet(s,first){
  const S=SHEETS[s.kind];const h=S.render(s);
  const parts={h:`<button class="back" data-act="close" aria-label="Back">${ICON.back}</button><h2>${h.title}</h2>${h.right||""}`,b:h.body,f:h.foot||""};
  const els={h:$(".sheet-h .in",s.el),b:$(".sheet-b .in",s.el),f:$(".sheet-f .in",s.el)};
  $(".sheet-f",s.el).hidden=!parts.f;
  const ae=document.activeElement;const typing=ae&&s.el.contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  for(const k of["h","b","f"]){
    if(!first&&s.parts[k]===parts[k])continue;
    if(!first&&typing&&els[k].contains(ae)){s.dirty=true;continue}
    if(first)els[k].innerHTML=parts[k];else keepInputs(els[k],()=>{els[k].innerHTML=parts[k]});
    s.parts[k]=parts[k];
  }
  S.after?.(s,first);
}
document.addEventListener("focusout",()=>setTimeout(()=>{for(const s of stack)if(s.dirty&&!s.el.contains(document.activeElement)){s.dirty=false;paintSheet(s)}},50));
const topS=()=>stack[stack.length-1];

function icsFor(p,mins){

  else{const x=pd(f.date);x.setDate(x.getDate()+1);dt=`DTSTART;VALUE=DATE:${d}\r\nDTEND;VALUE=DATE:${ymd(x).replace(/-/g,"")}`}
  const st=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  const al=mins.map(m=>`BEGIN:VALARM\r\nTRIGGER:-PT${m}M\r\nACTION:DISPLAY\r\nDESCRIPTION:${e(p.title)}\r\nEND:VALARM`).join("\r\n");
  return`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Yalla Guys//EN\r\nBEGIN:VEVENT\r\nUID:${p.id}@yallaguys\r\nDTSTAMP:${st}\r\n${dt}\r\nSUMMARY:${e((p.emoji||"")+" "+p.title)}\r\nLOCATION:${e((p.stops||[]).map(x=>x.name).join(" → "))}\r\nDESCRIPTION:${e(p.desc||"")}${al?"\r\n"+al:""}\r\nEND:VEVENT\r\nEND:VCALENDAR\r\n`;
}

    if(name){runSearch(s,name.slice(0,80),{link:url});return}
    s.state.msg=/goo\.gl|maps\.app/i.test(url)?"Short Google Maps links hide the location. Type the place name instead, or open the link in your browser and copy the long address from the top bar.":"That link has no location in it. Type the place name instead.";
    paintSugg(s);return;
  }
  if(text.length<2){paintSugg(s);return}
  s.state.res=localSearch(text);paintSugg(s);
  searchTimer=setTimeout(()=>runSearch(s,text),450);
}

/* ---------- photos (stored compressed inside the database) ---------- */
function loadImg(file){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=URL.createObjectURL(file)})}
function compress(img,max,q){const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);c.getContext("2d").drawImage(img,0,0,c.width,c.height);return new Promise(r=>c.toBlob(r,"image/jpeg",q))}
const toDataURL=b=>new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)});
async function storePhoto(file){const img=await loadImg(file);for(const[mx,q]of[[1280,.72],[1000,.66],[800,.6],[600,.55]]){const b=await compress(img,mx,q);if(b&&b.size<260000)return toDataURL(b)}return null}
async function addPhotos(planId,files,phase){
  if(!files.length)return;toast(`Uploading ${files.length} photo${files.length>1?"s":""}…`);let ok=0;
  for(const f of files){try{const src=await storePhoto(f);if(src){await Store.add("media",{planId,by:ME,at:now(),kind:"photo",src,caption:"",phase});ok++}}catch{}}
  toast(ok===files.length?`Added ${ok} photo${ok>1?"s":""}`:`Added ${ok} of ${files.length}. Some photos couldn't be read.`);
}

async function squarePhoto(file,size){const img=await loadImg(file);const m=Math.min(img.naturalWidth,img.naturalHeight);const c=document.createElement("canvas");c.width=c.height=size;c.getContext("2d").drawImage(img,(img.naturalWidth-m)/2,(img.naturalHeight-m)/2,m,m,0,0,size,size);return toDataURL(await new Promise(r=>c.toBlob(r,"image/jpeg",.8)))}

  remindToggle(d){const m=+d.m,id=d.id;const all=ls.get("yg-remind",{});const cur=all[id]||[...SET.remind];const i=cur.indexOf(m);if(i>=0)cur.splice(i,1);else cur.push(m);all[id]=cur.sort((a,b)=>b-a);ls.set("yg-remind",all);paintSheet(topS())},
  defRemind(d){const m=+d.m,i=SET.remind.indexOf(m);if(i>=0)SET.remind.splice(i,1);else SET.remind.push(m);SET.remind.sort((a,b)=>b-a);saveSet()},
  icsDl(d){const p=planById(d.id);if(!p?.final)return;const txt=icsFor(p,remindFor(p.id));const name=(p.title.replace(/[^\w]+/g,"-")||"plan")+".ics";
    const a=document.createElement("a");a.href=/iPhone|iPad/i.test(navigator.userAgent)?"data:text/calendar;charset=utf-8,"+encodeURIComponent(txt):URL.createObjectURL(new Blob([txt],{type:"text/calendar"}));a.download=name;document.body.appendChild(a);a.click();a.remove()},
  async vote(d){const r=myRsvp(d.id);const sl=new Set(r?.slots||[]);sl.has(d.slot)?sl.delete(d.slot):sl.add(d.slot);await Store.set("rsvps",d.id+"__"+ME,{planId:d.id,uid:ME,going:r?.going||(sl.size?"in":"maybe"),slots:[...sl],at:now()})},
  async rsvp(d){const r=myRsvp(d.id);await Store.set("rsvps",d.id+"__"+ME,{planId:d.id,uid:ME,going:d.k,slots:r?.slots||[],at:now()})},
  async lock(d){const p=planById(d.id),sl=(p.slots||[]).find(x=>x.id===d.slot);if(!sl)return;await Store.upd("plans",d.id,{final:{date:sl.date,start:sl.start||"",end:sl.end||""},status:"set"});if(p.chatId&&D.chats.some(c=>c.id===p.chatId))await Store.add("msgs",{chatId:p.chatId,by:ME,text:`📅 Locked in: ${fDate(sl.date)} ${fRange(sl.start,sl.end)}`,at:now()});toast("Locked in. It's on everyone's calendar now.")},
  async reopen(d){await Store.upd("plans",d.id,{final:null,status:"poll"});toast("Poll reopened")},
  async addSlot(d){const s=topS(),date=val("slD");if(!date)return toast("Pick a date first.");const p=planById(d.id);await Store.upd("plans",d.id,{slots:[...(p.slots||[]),{id:rid(),date,start:val("slS"),end:val("slE"),by:ME}]});["slD","slS","slE"].forEach(i=>{const e=$("#"+i,s.el);if(e)e.value=""})},
  async markDone(d){await Store.upd("plans",d.id,{status:"done"});toast("Moved to Memories. Add your photos!")},
  async unDone(d){await Store.upd("plans",d.id,{status:planById(d.id)?.final?"set":"poll"})},
  async delPlan(d){await Store.del("plans",d.id);for(const c of["rsvps","media","notes"])for(const x of D[c].filter(x=>x.planId===d.id))await Store.del(c,x.id);closeSheet();toast("Plan deleted")},
  addMedia(d){openSheet("media",{id:d.id,ph:d.ph})},
  mediaPhotos(){const s=topS();pickPhotos(fs=>{if(!fs.length)return;closeSheet();addPhotos(s.args.id,fs,s.args.ph)})},
  async mediaLink(){const s=topS(),u=val("mdUrl");if(!validUrl(u))return toast("Paste a full link that starts with https://");await Store.add("media",{planId:s.args.id,by:ME,at:now(),kind:linkKind(u),url:u,caption:val("mdCap"),phase:s.args.ph});closeSheet();toast("Added")},
  viewPhoto(d){openSheet("photo",{id:d.id})},
  async setCover(d){const m=D.media.find(x=>x.id===d.id);if(!m)return;const earliest=Math.min(...mediaOf(m.planId).map(x=>x.at));await Store.upd("media",m.id,{at:earliest-1});toast("Cover updated")},
  async delMedia(d){await Store.del("media",d.id);closeSheet();toast("Photo deleted")},
  async addNote(d){const el=$("#noteIn-"+CSS.escape(d.id));const t=(el?.value||"").trim();if(!t)return;el.value="";await Store.add("notes",{planId:d.id,by:ME,at:now(),text:t.slice(0,1000)})},
  async delNote(d){await Store.del("notes",d.id)},
  async planChat(d){const p=planById(d.id);let cid=p.chatId||"";
    if(cid&&!(await Store.joinChat(cid)))cid="";
    if(!cid){const ids=[...new Set([p.by,ME,...rsvpsOf(d.id).filter(r=>r.going!=="out").map(r=>r.uid)])];cid=await Store.add("chats",{name:p.title,emoji:p.emoji||"💬",members:ids,by:ME,at:now(),planId:d.id});await Store.upd("plans",d.id,{chatId:cid})}
    openSheet("chat",{id:cid})},
  calNav(d){const[y,m]=UI.calMonth.split("-").map(Number);const n=new Date(y,m-1+(+d.n),1);UI.calMonth=`${n.getFullYear()}-${pad(n.getMonth()+1)}`;render()},
  calDay(d){UI.calDay=d.d;if(d.d.slice(0,7)!==UI.calMonth)UI.calMonth=d.d.slice(0,7);render()},
  newBusy(d){openSheet("busy",{d:d.d})},
  async bzSave(){const date=val("bzD");if(!date)return toast("Pick a date.");const all=$("#bzAll").checked;const s=all?"":val("bzS"),e=all?"":val("bzE");const n=+val("bzR")||1;const label=val("bzL");
    for(let i=0;i<n;i++){const d=pd(date);d.setDate(d.getDate()+7*i);const id=await Store.add("busy",{uid:ME,date:ymd(d),start:s,end:e,label:MODE==="demo"?label:"",at:now()});if(label&&MODE!=="demo")await Store.setLabel(id,label)}
    closeSheet();toast(n>1?`Blocked ${n} weeks`:"Time blocked")},
  async delBusy(d){await Store.del("busy",d.id)},
  mapFilter(d){UI.mapFilter=d.k;render()},
  newChat(){openSheet("newChat")},
  ncEmoji(d){topS().state.emoji=d.v;paintSheet(topS())},
  async ncSave(){const s=topS(),n=val("ncN");const ids=$$("input[data-uid]",s.el).filter(x=>x.checked).map(x=>x.dataset.uid);if(!n)return toast("Name the group.");if(!ids.length)return toast("Pick at least one friend.");const id=await Store.add("chats",{name:n,emoji:s.state.emoji,members:[ME,...ids],by:ME,at:now(),planId:""});closeSheet();openSheet("chat",{id})},
  openChat(d){openSheet("chat",{id:d.id})},
  async send(d){const el=$("#chatIn-"+CSS.escape(d.id));const t=(el?.value||"").trim();if(!t)return;el.value="";el.style.height="";await Store.add("msgs",{chatId:d.id,by:ME,text:t.slice(0,2000),at:now()})},
  newExpense(d){openSheet("expense",{plan:d.plan||""})},
  editExpense(d){openSheet("expense",{id:d.id})},
  exAll(){$$("input[data-uid]",topS().el).forEach(x=>x.checked=true)},
  async exSave(){const s=topS(),t=val("exT"),a=parseFloat(val("exA"));if(!t)return toast("What was it for?");if(!(a>0))return toast("Enter the total in Dhs.");const split=$$("input[data-uid]",s.el).filter(x=>x.checked).map(x=>x.dataset.uid);if(!split.length)return toast("Pick who's splitting it.");
    const o={title:t,amount:Math.round(a*100)/100,paidBy:val("exP"),planId:val("exPl"),split};
    if(s.args.id)await Store.upd("expenses",s.args.id,o);else await Store.add("expenses",{...o,at:now(),by:ME});closeSheet();toast(`Saved · ${dhs(o.amount/split.length)} each`)},
  async exDel(){const s=topS();await Store.del("expenses",s.args.id);closeSheet();toast("Expense deleted")},
  async settle(d){await Store.add("settles",{from:d.from,to:d.to,amount:+d.amt,at:now(),by:ME});toast(`Recorded ${dhs(+d.amt)} payment`)},
  async delSettle(d){await Store.del("settles",d.id)},
};
document.addEventListener("click",ev=>{
  const el=ev.target.closest("[data-act]");if(!el)return;const fn=ACT[el.dataset.act];if(!fn)return;
  if(el.dataset.confirm){if(!el._armed){el._armed=true;const o=el.innerHTML;el.textContent=el.dataset.confirm;setTimeout(()=>{el._armed=false;if(el.isConnected)el.innerHTML=o},3000);return}}
  if(el.tagName==="A"&&el.getAttribute("href")==="#")ev.preventDefault();
  const r=fn(el.dataset,el,ev);if(r&&r.catch)r.catch(e=>{console.error(e);toast("Something went wrong. Try again.")});
});
document.addEventListener("input",ev=>{
  const el=ev.target;
  if(el.id==="edQ"){const s=stack.find(x=>x.kind==="edit");if(s)handleQuery(s,el.value)}
  if(el.classList.contains("compose")){el.style.height="";el.style.height=Math.min(el.scrollHeight,120)+"px"}
});
document.addEventListener("change",ev=>{
  const el=ev.target;if(el.id==="moneyPlan"){UI.moneyPlan=el.value;render()}
  if(["nMsgs","nPlans","nMoments"].includes(el.id)){SET[el.id]=el.checked;ls.set("yg-settings",SET)}
  if(el.id==="actAs"){ls.set("yg-actas",el.value);ME=el.value;while(stack.length)closeSheet();render();toast(ME==="me-demo"?"Back to being you":"Now testing as "+(mem(ME)?.nick||"a friend"))}
  if(el.id==="exPl"){const s=topS();s.state.plan=el.value}
  if(el.id==="bzAll"){["bzS","bzE"].forEach(i=>$("#"+i).disabled=el.checked)}
});
document.addEventListener("keydown",ev=>{
  const el=ev.target;
  if(ev.key==="Enter"&&!ev.shiftKey&&el.id?.startsWith("chatIn-")&&!/Android|iPhone|iPad/i.test(navigator.userAgent)){ev.preventDefault();ACT.send({id:el.id.slice(7)})}
  if(ev.key==="Enter"&&el.id==="edQ"){ev.preventDefault();const s=stack.find(x=>x.kind==="edit");if(s&&el.value.trim()){clearTimeout(searchTimer);runSearch(s,el.value.trim())}}
  if(ev.key==="Escape"&&stack.length)closeSheet();
});
Store.init();
async function notify(title,body,tag,data){
  if(!SET.notifyOn||!("Notification" in window)||Notification.permission!=="granted")return;
  try{const reg=await navigator.serviceWorker?.getRegistration();if(reg)await reg.showNotification(title,{body,tag,icon:"icon-192.png",badge:"icon-192.png",data});else new Notification(title,{body,tag})}catch{}
}
const SEEN={msgs:null,plans:null,moments:null};
function checkNotify(){
  if(!Store.ready||MODE==="loading"||MODE==="auth"||MODE==="join")return;
  const first=SEEN.msgs===null;
  if(first){SEEN.msgs=new Set(D.msgs.map(m=>m.id));SEEN.plans=new Set(visiblePlans().map(p=>p.id));SEEN.moments=new Set(D.moments.map(m=>m.id));return}
  const openChat=!document.hidden&&topS()?.kind==="chat"?topS().args.id:null;
  for(const m of D.msgs){if(SEEN.msgs.has(m.id))continue;SEEN.msgs.add(m.id);
    if(m.by!==ME&&m.chatId!==openChat&&SET.nMsgs&&now()-m.at<6e5){const c=D.chats.find(x=>x.id===m.chatId);notify(c?(c.dm?nick(m.by):`${c.emoji||"💬"} ${c.name}`):"New message",c?.dm?m.text:`${nick(m.by)}: ${m.text}`,"chat-"+m.chatId,{kind:"chat",id:m.chatId})}}
  for(const p of visiblePlans()){if(SEEN.plans.has(p.id))continue;SEEN.plans.add(p.id);
    if(p.by!==ME&&SET.nPlans&&now()-p.at<36e5)notify(`📌 New plan: ${p.title}`,`${nick(p.by)} ${(p.invited||[]).length?"invited you":"posted a plan"}. Vote on the dates!`,"plan-"+p.id,{kind:"plan",id:p.id})}
  for(const m of D.moments){if(SEEN.moments.has(m.id))continue;SEEN.moments.add(m.id);
    if(m.by!==ME&&SET.nMoments&&now()-m.at<36e5)notify(`📸 ${nick(m.by)} posted a moment`,m.caption||"Tap to see it","moment-"+m.id,{kind:"moment",id:m.id})}
  const un=myChats().reduce((n,c)=>n+unread(c),0);try{un?navigator.setAppBadge?.(un):navigator.clearAppBadge?.()}catch{}
}
function checkReminders(){
  if(!Store.ready||!SET.notifyOn)return;const fired=ls.get("yg-fired",{});let ch=false;
  for(const p of visiblePlans()){if(!p.final)continue;const r=myRsvp(p.id);if(!(r&&r.going!=="out")&&p.by!==ME)continue;
    const start=new Date(p.final.date+"T"+(p.final.start||"09:00")).getTime();if(now()>start)continue;
    for(const m of remindFor(p.id)){const key=`${p.id}|${p.final.date}|${p.final.start}|${m}`;if(fired[key]||now()<start-m*6e4)continue;fired[key]=1;ch=true;
      const lbl=m>=1440?`${m>=10080?"Next week":"Tomorrow"}${p.final.start?" at "+fTime(p.final.start):""}`:m?`In ${m>=60?m/60+" hour"+(m>60?"s":""):m+" min"}`:"Starting now";
      notify(`⏰ ${p.emoji||""} ${p.title}`,`${lbl}${(p.stops||[])[0]?" · "+p.stops[0].name:""}`,"rem-"+key,{kind:"plan",id:p.id})}}
  if(ch)ls.set("yg-fired",fired);
}
const _render=render;render=function(){_render();try{checkNotify()}catch(e){console.error(e)}};
setInterval(checkReminders,30000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)checkReminders()});
navigator.serviceWorker?.addEventListener("message",e=>{const d=e.data?.open;if(!d)return;if(d.kind==="chat")openSheet("chat",{id:d.id});else if(d.kind==="plan")openSheet("plan",{id:d.id});else if(d.kind==="moment")openSheet("moment",{id:d.id})});
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});

</script>
