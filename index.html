<style>
/* Layout: phone-first single column app shell — sticky header, scrolling view, fixed bottom tab bar, full-screen sheets that slide up. Centered 560px column on desktop. */
:root{
  --bg:#EEF1F4;--surface:#FFFFFF;--surface2:#E4E8ED;--fg:#111820;--muted:#5C6774;--line:#D5DBE2;
  --accent:#0B7A75;--accent-fg:#FFFFFF;--accent-soft:#D3EEEC;--sun:#C9661A;--sun-soft:#FBE6D2;
  --danger:#C2372F;--danger-soft:#F8DEDC;--ok:#2F8F4E;--warn:#A86A12;--warn-soft:#F7EACF;
  --land:#E9E2D0;--land-line:#C9BFA6;--sea:#CFE3EA;--shadow:0 6px 24px rgba(17,24,32,.12);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Inter",-apple-system,"Segoe UI",Roboto,system-ui,sans-serif;
  --r:14px;--tabh:64px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0E1318;--surface:#161D24;--surface2:#1F2830;--fg:#E9EEF2;--muted:#93A0AD;--line:#2A343E;
  --accent:#3CC0B7;--accent-fg:#04201E;--accent-soft:#12332F;--sun:#F29A4A;--sun-soft:#3A2716;
  --danger:#F06A60;--danger-soft:#3A1A18;--ok:#5CC27E;--warn:#E0A84A;--warn-soft:#3A2C12;
  --land:#26302B;--land-line:#3C4A42;--sea:#0F1D24;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1318;--surface:#161D24;--surface2:#1F2830;--fg:#E9EEF2;--muted:#93A0AD;--line:#2A343E;
  --accent:#3CC0B7;--accent-fg:#04201E;--accent-soft:#12332F;--sun:#F29A4A;--sun-soft:#3A2716;
  --danger:#F06A60;--danger-soft:#3A1A18;--ok:#5CC27E;--warn:#E0A84A;--warn-soft:#3A2C12;
  --land:#26302B;--land-line:#3C4A42;--sea:#0F1D24;--shadow:0 6px 24px rgba(0,0,0,.45);color-scheme:dark}
[hidden]{display:none!important}
*{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
html,body{height:100%}
html{background:var(--surface)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.app{max-width:560px;margin:0 auto;min-height:100%;padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 24px)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:10px}
.brand{font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:-.02em;flex:1;min-width:0}
.brand span{color:var(--accent);margin-left:2px}
.me-btn{border:0;background:var(--surface);border-radius:999px;padding:4px 12px 4px 4px;display:flex;align-items:center;gap:8px;box-shadow:0 1px 0 var(--line);font-weight:600;font-size:14px;min-height:40px}
.av{width:32px;height:32px;border-radius:50%;display:inline-grid;place-items:center;font-size:16px;flex:none;color:#fff;font-weight:700}
.av.sm{width:26px;height:26px;font-size:13px}
.av.xs{width:22px;height:22px;font-size:11px}
.stack{display:flex}.stack .av{margin-left:-7px;border:2px solid var(--surface)}.stack .av:first-child{margin-left:0}
.banner{margin-block:4px 10px;padding:10px 12px;border-radius:12px;background:var(--warn-soft);color:var(--fg);font-size:13px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:flex;height:var(--tabh);overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-snap-type:x proximity;overscroll-behavior-x:contain;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%)}
nav.tabs .in::-webkit-scrollbar{display:none}
nav.tabs .in>button{flex:0 0 auto;min-width:76px;padding:0 6px;scroll-snap-align:center}
nav.tabs button span:not(.badge){font-size:12.5px;white-space:nowrap}
nav.tabs button svg{width:27px!important;height:27px!important}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="true"]{color:var(--accent)}
.badge{position:absolute;top:8px;left:calc(50% + 6px);background:var(--danger);color:#fff;border-radius:999px;font-size:10px;min-width:17px;height:17px;display:grid;place-items:center;padding:0 4px}
.view-title{display:flex;align-items:end;justify-content:space-between;gap:10px;margin-block:6px 12px}
.view-title h1{font-size:30px;font-weight:800}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 10px;font-weight:600;font-size:13px;color:var(--muted);min-height:36px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.list{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.pcard{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:18px;overflow:hidden;padding:0}
.pcard .cover{height:118px;background-size:cover;background-position:center;position:relative;display:flex;align-items:flex-end;padding:10px 12px}
.pcard .cover .emo{font-size:40px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.2))}
.pcard .body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.pcard h3{font-size:19px;font-weight:700}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.meta{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.pill.vote{background:var(--sun-soft);color:var(--sun)}
.pill.set{background:var(--accent-soft);color:var(--accent)}
.pill.done{background:var(--surface2);color:var(--muted)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--danger-soft);color:var(--danger)}
.fab{position:fixed;z-index:25;right:max(16px,calc((100vw - 560px)/2 + 16px),env(safe-area-inset-right,0px));bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 16px);border:0;background:var(--accent);color:var(--accent-fg);font-weight:700;font-size:16px;border-radius:999px;padding:0 20px;height:54px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
.fab b{font-size:24px;line-height:1;font-weight:500}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;font-size:14px}
a.btn{color:var(--fg)}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sun{background:var(--sun);color:#fff;border-color:var(--sun)}
.btn.ghost{background:none;border-color:transparent;color:var(--accent)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:34px;padding:6px 10px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.empty{padding:28px 18px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty h3{color:var(--fg);font-size:18px;margin-bottom:6px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;font-size:16px;min-height:46px;color:var(--fg)}
textarea.inp{min-height:84px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px}
.grid3 .inp{padding-left:8px;padding-right:6px}
.grid2>*,.grid3>*{min-width:0}
.form{display:flex;flex-direction:column;gap:14px}
.sec{display:flex;flex-direction:column;gap:10px;padding-block:16px;border-top:1px solid var(--line)}
.sec:first-child{border-top:0}
.sec h2{font-size:18px;font-weight:700}
.sec .hint{font-size:12px;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.stkrow{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -16px;padding-inline:16px}.chips.stkrow::-webkit-scrollbar{display:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;min-height:36px;display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.emo-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;max-height:168px;overflow-y:auto;padding:2px;scrollbar-width:thin}
.emo-pick button{width:100%!important}
.emo-pick button{flex:none;width:46px;height:46px;font-size:24px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.emo-pick button[aria-pressed="true"]{border:2px solid var(--accent);background:var(--accent-soft)}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.item .grow{flex:1;min-width:0}
.item .t{font-weight:600;overflow-wrap:anywhere}
.x{border:0;background:none;color:var(--muted);width:36px;height:36px;border-radius:50%;font-size:18px;flex:none}
.num{font-variant-numeric:tabular-nums}
/* sheets */
#sheets .sheet{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheets .sheet{animation:none}}
.sheet-h{flex:none;display:flex;align-items:center;gap:8px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;border-bottom:1px solid var(--line);background:var(--bg)}
.sheet-h .in{max-width:560px;margin:0 auto;width:100%;display:flex;align-items:center;gap:8px}
.sheet-h h2{flex:1;font-size:18px;font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.back{border:0;background:var(--surface);width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.sheet-b{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-b .top-in{padding-bottom:0!important}
.sheet-b .top-in:not([hidden])+.main-in{padding-top:0}
.sheet-b .in{max-width:560px;margin:0 auto;padding-block:12px calc(env(safe-area-inset-bottom,0px) + 32px)}
.sheet-f{flex:none;border-top:1px solid var(--line);background:var(--surface);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);padding-top:10px}
.sheet-f .in{max-width:560px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
/* plan detail */
.hero{border-radius:18px;min-height:150px;background-size:cover;background-position:center;display:flex;align-items:flex-end;padding:14px;position:relative;overflow:hidden}
.hero .emo{font-size:52px;line-height:1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.35))}
.hero .emo{position:relative;z-index:1}
.when{display:flex;gap:12px;align-items:center;padding:14px;border-radius:14px;background:var(--accent-soft)}
.when .d{font-family:var(--f-display);font-weight:800;font-size:22px;color:var(--accent);line-height:1.1}
.cal-ic{flex:none;width:54px;border-radius:10px;overflow:hidden;background:var(--surface);text-align:center;border:1px solid var(--line)}
.cal-ic .m{background:var(--sun);color:#fff;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 0}
.cal-ic .dd{font-family:var(--f-display);font-size:24px;font-weight:800;padding:2px 0 4px}
.slot{padding:12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.slot.mine{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bar{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:99px}
.vote-btn{border:2px solid var(--line);background:var(--surface);border-radius:10px;width:44px;height:44px;flex:none;font-size:20px;display:grid;place-items:center}
.vote-btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.media-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.media-grid>*{aspect-ratio:1;border-radius:10px;overflow:hidden;border:0;padding:0;background:var(--surface2);position:relative;min-width:0}
.media-grid img{width:100%;height:100%;object-fit:cover;display:block}
.reel{display:flex;flex-direction:column;justify-content:space-between;padding:8px;text-align:left;color:#fff;background:linear-gradient(160deg,#833AB4,#E1306C 55%,#F77737);text-decoration:none;font-size:12px;font-weight:600}
.reel.lnk{background:linear-gradient(160deg,#0B7A75,#13506F)}
.reel .play{font-size:22px}
.reel .cap{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.add-tile{display:grid;place-items:center;color:var(--accent);font-weight:700;font-size:13px;border:2px dashed var(--line)!important;background:var(--surface)!important}
.mini-map,.map-full{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--sea)}
.mini-map{height:220px}
.leg{display:flex;gap:10px;align-items:flex-start}
.leg .n{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.leg .eta{font-size:12px;color:var(--muted);padding:4px 0 6px 36px;border-left:2px dotted var(--line);margin-left:12px;padding-left:22px}
.note{padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;display:flex;gap:10px}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.danger-zone{display:flex;gap:8px;flex-wrap:wrap}
/* calendar */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px}
.cal-h{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 8px}
.cal-h h2{font-size:20px;font-weight:800}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cal-g .dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;padding:4px 0;letter-spacing:.06em}
.day{border:0;background:none;border-radius:10px;aspect-ratio:1/1.05;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:6px;gap:3px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}
.day.out{color:var(--muted);opacity:.45}
.day.today .dn{background:var(--sun);color:#fff}
.day .dn{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:14px}
.day[aria-pressed="true"]{background:var(--accent-soft)}
.dots{display:flex;gap:3px;height:7px}
.dots i{width:6px;height:6px;border-radius:50%;flex:none}
.dot-plan{background:var(--accent)}.dot-poll{border:1.5px solid var(--sun);box-sizing:border-box}.dot-me{background:var(--fg)}.dot-oth{background:var(--muted);opacity:.6}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);padding:8px 4px 2px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:8px;height:8px;border-radius:50%;display:inline-block}
.ev{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--line);align-items:center;text-align:left;width:100%}
.ev .tm{flex:none;width:66px;font-size:12px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ev .stripe{width:4px;align-self:stretch;border-radius:4px;flex:none}
.ev.busy .stripe{background:repeating-linear-gradient(45deg,var(--muted) 0 3px,transparent 3px 6px)}
/* map */
.map-full{height:calc(100dvh - 260px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:300px}
.mini-map,.map-full,.leaflet-container{position:relative;z-index:0;isolation:isolate;overflow:hidden;contain:paint}
.leaflet-container{background:var(--sea);font-family:var(--f-body)}
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin b{transform:rotate(45deg);color:#fff;font-size:13px;font-weight:800}
.pin-new{background:var(--danger)}
.plabel{background:none;border:0;box-shadow:none;color:var(--muted);font-size:10px;font-weight:600;white-space:nowrap}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--surface);color:var(--fg)}
.leaflet-popup-content{margin:10px 12px;font-size:13px}
.leaflet-bar a{background:var(--surface)!important;color:var(--fg)!important;border-color:var(--line)!important;width:36px!important;height:36px!important;line-height:36px!important}
.sugg{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.sugg button{border:0;background:none;text-align:left;padding:11px 12px;border-top:1px solid var(--line);min-height:44px}
.sugg button:first-child{border-top:0}
/* chat */
.chat-row{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;width:100%;text-align:left}
.chat-row .grow{flex:1;min-width:0}
.chat-row .last{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gav{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--accent-soft)}
.msgs{display:flex;flex-direction:column;gap:4px}
.msg{max-width:80%;display:flex;flex-direction:column;gap:2px;align-items:flex-start;align-self:flex-start}
.msg .bub.deleted{font-style:italic;opacity:.7;background:transparent!important;color:var(--muted)!important;border:1px dashed var(--line)!important}
.edited{font-size:10px;color:var(--muted);padding:0 8px;font-weight:600}
.msg[data-act]{cursor:pointer}
.msg .bub{padding:8px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);white-space:pre-wrap;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;align-items:flex-end}
.msg.me .bub{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.msg .who{font-size:11px;color:var(--muted);font-weight:600;padding:0 6px}
.daysep{align-self:center;font-size:11px;font-weight:700;color:var(--muted);padding:10px 0 4px;letter-spacing:.06em;text-transform:uppercase}
.compose{flex:1;min-width:0;border:1px solid var(--line);border-radius:22px;padding:10px 14px;font-size:16px;min-height:44px;max-height:120px;background:var(--bg);resize:none}
.send{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
/* money */
.money-hero{padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.money-hero .big{font-family:var(--f-display);font-size:34px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.pos{color:var(--ok)}.neg{color:var(--danger)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.check{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--surface);min-height:46px}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.lightbox{background:#000!important}
.lightbox .sheet-h{background:#000;border-color:#222;color:#fff}
.lightbox .sheet-b{display:flex;flex-direction:column}
.lightbox .sheet-b .in{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;box-sizing:border-box}
.lightbox .sheet-b img{width:100%;max-height:calc(100dvh - 150px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));object-fit:contain;display:block;margin:0 auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 80px);z-index:90;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.loading{display:grid;place-items:center;min-height:60vh;color:var(--muted);text-align:center;gap:6px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.vis-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
html,body{overscroll-behavior:none;overscroll-behavior-x:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,.bub,.note p,p{-webkit-user-select:text;user-select:text}
.install{display:flex;gap:12px;align-items:flex-start;margin-block:4px 12px;padding:12px 14px;border-radius:14px;background:var(--accent-soft);font-size:13px}
.install img{width:44px;height:44px;border-radius:11px;flex:none}
.install b{font-size:14px}
.av{overflow:hidden}.av img{width:100%;height:100%;object-fit:cover;display:block}
.prof-hero{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:10px 0 4px;position:relative}
.prof-hero .av{width:108px;height:108px;font-size:54px;box-shadow:0 0 0 4px var(--bg),0 0 0 7px var(--accent)}
.prof-hero h1{font-size:28px;font-weight:800}
.vibe{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:600}
.stickers{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:26px;line-height:1}
.stickers span{display:inline-block;transform:rotate(var(--r,0deg))}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.facts{display:grid;gap:8px}
.fact{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.fact .k{font-size:12px;color:var(--muted);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--sun-soft);color:var(--sun);border-radius:999px;padding:4px 10px;font-size:13px;font-weight:700}
.shoot{display:flex;gap:10px;align-items:center;padding:14px;border-radius:18px;background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,#13506F));color:var(--accent-fg)}
.shoot .big{flex:1;min-width:0}
.shoot b{font-family:var(--f-display);font-size:20px;display:block}
.shoot .cam{width:64px;height:64px;border-radius:50%;border:4px solid var(--accent-fg);background:rgba(255,255,255,.18);display:grid;place-items:center;font-size:26px;flex:none;color:var(--accent-fg)}
.moment{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.moment .mh{display:flex;align-items:center;gap:10px;padding:10px 12px}
.moment .ph{position:relative;aspect-ratio:3/4;background:var(--surface2);overflow:hidden}
.moment .ph img{width:100%;height:100%;object-fit:cover;display:block}
.moment .ph.locked img{filter:blur(22px) saturate(1.2);transform:scale(1.15)}
.moment .lock{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:#fff;font-weight:700;padding:20px;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.moment .cap{padding:10px 12px 0;overflow-wrap:anywhere}
.reacts{display:flex;gap:6px;flex-wrap:wrap;padding:10px 12px 12px;align-items:center}
.rx{border:1px solid var(--line);background:var(--bg);border-radius:999px;min-height:36px;padding:0 10px;font-size:16px;display:inline-flex;align-items:center;gap:4px}
.rx[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rx small{font-size:12px;font-weight:700}
.streak{display:inline-flex;align-items:center;gap:4px;background:var(--sun-soft);color:var(--sun);border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px}
.daylabel{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:8px 2px 0}
.people-row{display:flex;gap:12px;overflow-x:auto;margin:-6px -6px 12px;padding:6px 6px 4px;scrollbar-width:none}
.prof-btn{border:0;background:none;padding:0;display:inline-flex;align-items:center;gap:8px;color:inherit;text-align:left}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.swatch{width:46px;height:46px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
.swatch[aria-pressed="true"]{border-color:var(--fg)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:52px}
.toggle input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.plan-msg{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 12px;max-width:100%;min-width:200px;color:var(--fg)}
.plan-msg .k{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.reels{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;margin-inline:-2px;scrollbar-width:none}
.reel-card{flex:none;width:min(240px,64vw);scroll-snap-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.reel-frame{position:relative;aspect-ratio:4/5;overflow:hidden;background:#000}
.reel-frame.tk,.reel-frame.yt{aspect-ratio:9/16}
.reel-frame iframe{position:absolute;left:0;top:0;width:100%;height:100%;border:0;pointer-events:none;background:#000}
.reel-frame.ig iframe{top:-54px;height:calc(100% + 360px)}
.reel-frame.tk iframe{height:calc(100% + 220px)}
.reel-hit{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:8px;background:linear-gradient(180deg,transparent 65%,rgba(0,0,0,.55));text-decoration:none}
.reel-badge{background:rgba(0,0,0,.55);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:4px 9px;backdrop-filter:blur(4px)}
.reel-card .rf{display:flex;align-items:center;gap:8px;padding:8px 10px;font-size:13px}
.board{columns:2;column-gap:8px}
.board>*{break-inside:avoid;margin:0 0 8px;display:block;width:100%;border-radius:12px;overflow:hidden;position:relative}
.board img{width:100%;display:block}
.board .bphoto{border:0;padding:0;background:var(--surface2)}
.bnote{padding:12px;color:#1F2328;font-weight:600;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:0 2px 6px rgba(0,0,0,.12);transform:rotate(var(--r,0deg))}
.bnote small{display:block;font-weight:500;opacity:.65;margin-top:6px;font-size:11px}
.bcolor{height:96px;display:flex;align-items:flex-end;padding:8px;font:700 12px/1 var(--f-body);letter-spacing:.04em}
.bcolor span{background:rgba(255,255,255,.85);color:#1F2328;border-radius:6px;padding:4px 6px}
.blink{padding:12px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);font-size:13px}
.blink b{display:block;font-size:14px;margin-bottom:2px;overflow-wrap:anywhere}
.bdel{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:13px}
.note-colors{display:flex;gap:8px}
.note-colors button{width:40px;height:40px;border-radius:10px;border:3px solid transparent}
.note-colors button[aria-pressed="true"]{border-color:var(--fg)}
.att{flex:none;width:36px;height:44px;border:0;background:none;font-size:20px;border-radius:12px;display:grid;place-items:center}
.att:active{background:var(--surface2)}
.mediab{padding:4px!important;display:flex;flex-direction:column;gap:4px}
.mediab>div{padding:4px 8px 6px}
.mimg,.vposter{display:block;border:0;padding:0;border-radius:14px;overflow:hidden;position:relative;max-width:240px;background:#000}
.mimg img,.vposter img{display:block;width:100%;max-height:320px;object-fit:cover}
.vposter{min-width:160px;min-height:120px}
.vplay{position:absolute;inset:0;display:grid;place-items:center;font-size:34px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6)}
.vdur{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.6);color:#fff;font-size:11px;font-weight:700;border-radius:6px;padding:2px 6px}
.voice{display:flex;align-items:center;gap:8px;min-width:190px;padding:4px 6px}
.vbtn{width:36px;height:36px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-fg);font-size:14px;flex:none}
.msg.me .vbtn{background:var(--accent-fg);color:var(--accent)}
.vbar{flex:1;height:4px;border-radius:4px;background:color-mix(in srgb,currentColor 25%,transparent);overflow:hidden}
.vbar i{display:block;height:100%;width:0;background:currentColor}
.vtime{font-size:12px;font-variant-numeric:tabular-nums;opacity:.85}
.vtile{display:flex!important;flex-direction:column;justify-content:center;align-items:center;gap:6px;background:var(--accent-soft)!important;color:var(--fg)}
.vtile .voice{min-width:0;flex-direction:column}
.vtile .vbar{width:70%;flex:none}
.media-grid .vposter{max-width:none;min-width:0;min-height:0;width:100%;height:100%}
.media-grid .vposter img{height:100%;max-height:none}
#recbar{position:fixed;left:0;right:0;bottom:0;z-index:80;background:var(--surface);border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:var(--shadow)}
#recbar .dot{width:12px;height:12px;border-radius:50%;background:var(--danger);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.25}}
.thumbs{display:flex;gap:4px}
.thumbs img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.tl-wrap{position:relative;margin-inline:-16px;height:290px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent);mask-image:linear-gradient(90deg,transparent,#000 14%,#000 86%,transparent)}
.tl-strip{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-block:0;height:290px;align-items:stretch;overscroll-behavior-x:contain;position:relative;z-index:1}
.tl-line{position:absolute;left:0;right:0;bottom:58px;height:3px;border-radius:3px;background:var(--line)}
.tslot{justify-content:flex-end;padding-bottom:12px!important;height:290px}
.tslot .pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--surface2);border:2px solid var(--line);display:grid;place-items:center;margin-bottom:14px;transition:all .2s;flex:none}
.tslot .pin>span{transform:rotate(45deg);font-size:13px;line-height:1}
.tslot .pin.dot{width:10px;height:10px;border-radius:50%;transform:none;margin-bottom:22px;background:var(--line);border:0}
.tslot.has .pin{background:var(--accent);border-color:var(--accent)}
.tslot.has.fut .pin{background:var(--surface);border:2px dashed var(--accent)}
.tslot.on .pin{width:52px;height:52px;box-shadow:0 6px 16px rgba(0,0,0,.3)}
.tslot.on .pin>span{font-size:24px}
.tslot.on .pin.dot{width:14px;height:14px;box-shadow:none;margin-bottom:20px;background:var(--muted)}
.tl-fan{position:absolute;left:50%;top:6px;transform:translateX(-50%);width:230px;height:170px;z-index:2;border:0;background:none;padding:0;display:block}
.tl-fan .fp{position:absolute;left:50%;top:10px;width:92px;height:118px;margin-left:-46px;border-radius:12px;background:var(--surface2) center/cover;border:3px solid #fff;box-shadow:0 8px 20px rgba(0,0,0,.35);transform:translateX(var(--x)) rotate(var(--r));animation:fanUp .35s cubic-bezier(.2,.9,.3,1.3) both}
.tl-fan .fp.txt{display:flex;align-items:center;justify-content:center;padding:8px;text-align:center;color:#1F2328;font-weight:700;font-size:12px;line-height:1.25;overflow:hidden;border-color:rgba(255,255,255,.9)}
.tl-fan .fp.txt span{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.tl-fan .fp.v::after{content:"▶";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:22px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.tl-fan .nm{position:absolute;left:0;right:0;bottom:0;text-align:center;font-weight:800;font-size:14px;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;animation:nmUp .3s both}
@keyframes fanUp{from{opacity:0;transform:translateY(40px) scale(.6)}to{opacity:1;transform:translateX(var(--x)) rotate(var(--r))}}
@keyframes nmUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.tl-fan .fp,.tl-fan .nm{animation:none}}
.tl-strip::-webkit-scrollbar{display:none}
.tslot{flex:none;width:76px;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;opacity:.45;transform:scale(.88);transition:opacity .18s,transform .18s;border:0;background:none;padding:0;color:var(--fg)}
.tslot.m{width:96px}
.tslot.on{opacity:1;transform:scale(1.08)}
.tslot .dl{font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.tslot .dn{font-family:var(--f-display);font-size:22px;font-weight:800;line-height:1}
.tslot.today .dn,.tslot.today .dl{color:var(--sun)}
.tslot .th{width:58px;height:58px;border-radius:14px;background:var(--surface2) center/cover no-repeat;position:relative;display:grid;place-items:center;font-size:22px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.tslot.m .th{width:76px;height:76px}
.tslot.fut .th{outline:2px dashed var(--line);outline-offset:-2px}
.tslot .th.empty{background:transparent;box-shadow:none;font-size:6px;color:var(--line)}
.tslot .cnt{position:absolute;right:-6px;top:-6px;background:var(--accent);color:var(--accent-fg);border-radius:999px;font-size:10px;padding:2px 6px;font-weight:800}
.tslot .tk{width:2px;height:10px;border-radius:2px;background:var(--line)}
.tslot.on .tk{background:var(--accent);height:16px}
.tl-needle{position:absolute;left:50%;bottom:-2px;z-index:2;width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:10px solid var(--accent);transform:translateX(-50%);pointer-events:none}
.tl-wrap{height:330px!important}
.tl-line,.tl-needle{display:none!important}
.tl-strip{height:330px!important}
.tslot,.tslot.on{height:330px!important;justify-content:flex-end!important;gap:0!important;padding:0 0 6px!important;transform:none!important}
.tslot .pin{margin-bottom:8px!important}
.tslot .pin.dot{margin-bottom:12px!important}
.tslot .ln{align-self:stretch;height:3px;background:var(--line);margin-bottom:8px;flex:none}
.tslot.on .ln{background:linear-gradient(90deg,var(--line),var(--accent),var(--line))}
.tslot .dl{margin:0!important;height:14px;line-height:14px}
.tslot .dn{height:28px;line-height:28px}
.tl-fan{height:190px!important;top:4px!important}
.tl-head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-top:14px}
.tl-head h2{font-size:22px;font-weight:800}
.ride-me{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.rstop{display:flex;gap:10px;align-items:flex-start}
.rstop .n{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}
.rstop .tm{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.rleg{font-size:12px;color:var(--muted);margin:-4px 0 -4px 13px;padding:4px 0 4px 23px;border-left:2px dotted var(--line)}
.stepper{display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.stepper button{border:0;background:var(--surface2);width:40px;height:40px;font-size:18px}
.stepper b{min-width:40px;text-align:center}
.fpin{position:relative;width:46px;height:46px}
.fpin .av img{width:100%!important;height:100%!important;max-width:none!important;object-fit:cover;display:block}
.fpin .av{width:46px;height:46px;font-size:22px;border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35)}
.fpin.me .av{border-color:var(--accent)}
.fpin.old .av{filter:grayscale(.8);opacity:.75}
.fpin::after{content:"";position:absolute;left:50%;bottom:-7px;transform:translateX(-50%);border:7px solid transparent;border-top-color:#fff;border-bottom:0}
.fpin.me::after{border-top-color:var(--accent)}
.fpin .pulse{position:absolute;inset:-8px;border-radius:50%;background:var(--accent);opacity:.25;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.6);opacity:.35}100%{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.fpin .pulse{animation:none}}
.share-card{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);border:1px solid var(--line);margin-bottom:10px}
.dist{font-family:var(--f-display);font-weight:800;font-size:18px;white-space:nowrap;font-variant-numeric:tabular-nums}
#updBar{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);z-index:95;border:0;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:14px;border-radius:999px;padding:12px 18px;box-shadow:var(--shadow);white-space:nowrap}
.camx{position:fixed;inset:0;z-index:70;background:#000;display:flex;flex-direction:column;color:#fff}
.camx video,.camx img.shot,.camx video.shot{flex:1;min-height:0;width:100%;object-fit:cover;background:#000}
.camx .mirror{transform:scaleX(-1)}
.cam-top{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;z-index:2}
.cam-top button,.cam-flip{width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:20px}
.cam-rec{background:var(--danger);color:#fff;border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.cam-bot{display:flex;flex-direction:column;align-items:center;gap:14px;padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 18px);background:#000}
.cam-modes{display:flex;gap:6px}
.cam-modes button{border:0;background:none;color:rgba(255,255,255,.6);font-weight:800;font-size:13px;letter-spacing:.06em;padding:6px 10px;border-radius:999px}
.cam-modes button[aria-pressed="true"]{color:#000;background:#fff}
.cam-row{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:360px}
.shutter{width:76px;height:76px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.9);transition:all .15s}
.shutter.vid{background:var(--danger)}
.shutter.rec{border-radius:18px;transform:scale(.8);background:var(--danger)}
.cam-side{width:44px}
.cam-msg{margin:auto;padding:24px;text-align:center;color:#ddd;max-width:320px}
.pchips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:0 -16px 14px;padding:0 16px}
.pchips::-webkit-scrollbar{display:none}
.pchips .chip{flex:none}
.wish{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.wish.done{opacity:.6}
.wish.done h3{text-decoration:line-through}
.wish h3{font-size:17px;font-weight:700}
.wish .ph{width:100%;max-height:200px;object-fit:cover;border-radius:12px;display:block}
.vis{font-size:11px;font-weight:800;border-radius:999px;padding:3px 8px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px 12px 18px;display:flex;gap:12px;align-items:center;width:100%;text-align:left;color:var(--fg);overflow:hidden}
.ticket::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:repeating-linear-gradient(180deg,var(--sun) 0 8px,transparent 8px 14px)}
.ticket .tk-ic{font-size:26px}
.ticket .tk-code{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.06em;font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bigcode{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:26px;font-weight:800;letter-spacing:.12em;text-align:center;padding:18px;border-radius:14px;background:#fff;color:#111;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
.offer{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.offer .oic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:var(--sun-soft);flex:none}
.offer-near{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:14px;background:var(--sun-soft);border:1px solid color-mix(in srgb,var(--sun) 35%,transparent)}
.ebadge{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:800;color:var(--sun);background:var(--sun-soft);border-radius:999px;padding:2px 8px;white-space:nowrap}
.att-row{display:flex;gap:6px;flex-wrap:wrap}
.att-list{display:flex;flex-direction:column;gap:8px}
.halo{position:relative;width:200px;height:200px;display:grid;place-items:center;margin:10px 0 -6px}
.halo>span:not(.av){position:absolute;font-size:28px;line-height:1;transform:translate(-50%,-50%) rotate(var(--r));animation:popIn .4s cubic-bezier(.2,.9,.3,1.4) both;filter:drop-shadow(0 2px 3px rgba(0,0,0,.3))}
@keyframes popIn{from{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}}
@media (prefers-reduced-motion:reduce){.halo>span:not(.av){animation:none}}
.dot-bday{background:#FF7AB8}
.dots{align-items:center}
.dots i.dot-bday,.legend i.dot-bday{border-radius:1px;transform:rotate(45deg) scale(.82)}
.dots i.dot-plan,.legend i.dot-plan{border-radius:2px}
.dots i.dot-me,.legend i.dot-me{width:10px;height:3px;border-radius:2px}
.mosaic{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:110px;grid-auto-flow:dense;gap:6px}
.mosaic .mt{position:relative;border-radius:12px;overflow:hidden;background:var(--surface2);border:0;padding:0}
.mosaic .mt.big{grid-column:span 2;grid-row:span 2}
.mosaic .mt.tall{grid-row:span 2}
.mosaic .mt img{width:100%;height:100%;object-fit:cover;display:block}
.mosaic .mt .who{position:absolute;left:6px;bottom:6px}
.mosaic .mt .dl{position:absolute;right:6px;top:6px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(0,0,0,.5);color:#fff;font-size:15px;display:grid;place-items:center}
.collage{width:100%;border-radius:16px;display:block;box-shadow:var(--shadow);background:var(--surface2);aspect-ratio:4/5;object-fit:cover}
.collage-wrap.film{max-height:68dvh;overflow-y:auto;border-radius:16px;box-shadow:var(--shadow);-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:#111}
.collage-wrap.film .collage{aspect-ratio:auto;height:auto;object-fit:contain;box-shadow:none;border-radius:0}
.collage-styles{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.mday{border:0;aspect-ratio:3/4;border-radius:10px;background:var(--surface2) center/cover no-repeat;position:relative;padding:0;display:flex;align-items:flex-start;justify-content:flex-start;min-width:0;color:var(--fg)}
.mday.out{opacity:.35}
.mday[style*="background-image"] .mdn{background:rgba(0,0,0,.5);color:#fff}
.mday .mdn{margin:4px;font-size:11px;font-weight:800;border-radius:6px;padding:1px 5px;font-variant-numeric:tabular-nums}
.mday.today .mdn{background:var(--sun);color:#fff}
.mday[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:-1px}
.mday .mcnt{position:absolute;right:4px;bottom:4px;background:var(--accent);color:var(--accent-fg);font-size:10px;font-weight:800;border-radius:999px;padding:1px 6px}
.fpick{flex-direction:column;gap:4px;font-size:11px;font-weight:600;width:60px;flex:none;opacity:.55}
.fpick[aria-pressed="true"]{opacity:1}
.fpick[aria-pressed="true"] .av{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--accent)}
.fpick>span:last-child{max-width:60px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot-ok{background:var(--ok)}
.fcal{display:flex;flex-direction:column;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px}
.fscale{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);font-weight:700;margin-left:76px}
.ftl{display:flex;align-items:center;gap:8px}
.fwho{display:flex;align-items:center;gap:6px;width:70px;flex:none;font-size:12px;font-weight:700;overflow:hidden}
.fwho>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ftrack{flex:1;height:16px;border-radius:8px;background:color-mix(in srgb,var(--ok) 22%,var(--surface2));position:relative;overflow:hidden}
.ftrack i{position:absolute;top:0;bottom:0;background:var(--danger);border-radius:4px;opacity:.85}
.fbusy{display:flex;flex-wrap:wrap;gap:4px 10px;margin:-2px 0 4px 78px;font-size:11px;color:var(--muted)}
.arch-btn{position:relative;font-size:17px;padding:6px 10px}
.arch-btn span{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px;color:var(--fg)}
.quote{display:flex;flex-direction:column;align-items:flex-start;gap:1px;max-width:100%;border:0;border-left:3px solid var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface));color:var(--fg);border-radius:10px;padding:5px 9px;margin-bottom:2px;text-align:left;font-size:12px}
.quote b{font-size:11px;color:var(--accent)} .quote span{color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.replybar{display:flex;align-items:center;gap:8px;border-left:3px solid var(--accent);background:var(--surface2);border-radius:10px;padding:6px 6px 6px 10px}
.replybar b{display:block;font-size:12px;color:var(--accent)} .replybar span>span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{transition:transform .15s}
.msg .mlike{margin-top:-9px;margin-inline:8px;position:relative;z-index:1;border:2px solid var(--bg);background:var(--surface2);border-radius:999px;padding:1px 6px;font-size:12px;line-height:1.4;display:inline-flex;gap:3px;align-items:center;color:var(--fg)}
.msg .mlike b{font-size:11px}
.hpop{position:absolute;left:50%;top:50%;font-size:34px;pointer-events:none;transform:translate(-50%,-50%) scale(.3);animation:hpop .7s ease-out forwards}
@keyframes hpop{40%{transform:translate(-50%,-50%) scale(1.15);opacity:1}100%{transform:translate(-50%,-90%) scale(1);opacity:0}}
.msg .stamp{font-size:10.5px;color:var(--muted);margin-top:2px;display:inline-flex;gap:4px;align-items:center}
.msg .tk{letter-spacing:-3px;font-weight:700;padding-right:3px}
.msg .tk.seen{color:var(--accent)}
.msg .rcpt{font-size:11px;color:var(--muted);font-weight:600;margin-top:1px}
.msg.flash .bub{animation:flash 1.2s}
@keyframes flash{0%,60%{box-shadow:0 0 0 3px var(--sun)}100%{box-shadow:none}}
.pdfopt{display:flex;gap:12px;align-items:center;width:100%;padding:12px 14px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer}
.pdfopt[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.shstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}.shstats div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px}.shstats b{font-size:20px}.shstats span{font-size:11px;color:var(--muted);text-align:center}
.hwrap{display:flex;flex-direction:column}
.proofbtn{align-self:flex-end;margin:-6px 14px 0 0;position:relative;z-index:1;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font:inherit;font-size:12px;font-weight:700;border-radius:0 0 10px 10px;padding:4px 10px 5px}
.proofs{display:flex;gap:12px;overflow-x:auto;padding:12px 6px 8px;scrollbar-width:none}
.proofs::-webkit-scrollbar{display:none}
.pola{all:unset;flex:none;width:92px;background:#FFFDF7;padding:5px 5px 7px;border-radius:5px;box-shadow:0 4px 12px rgba(0,0,0,.35);transform:rotate(-3deg);position:relative;cursor:pointer;box-sizing:border-box}
.proofs .pola:nth-child(even){transform:rotate(3deg)}
.pola::before{content:"";position:absolute;top:-6px;left:50%;width:34px;height:12px;background:rgba(255,214,102,.8);transform:translateX(-50%) rotate(-5deg);border-radius:2px}
.pola img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:2px;display:block}
.pola .cap{display:block;color:#2B2B2B;font-size:11px;font-weight:700;text-align:center;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:"Marker Felt","Chalkboard SE","Comic Sans MS","Segoe Print",cursive}
.pola .stk{position:absolute;bottom:14px;right:-8px;font-size:22px;transform:rotate(14deg);z-index:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.pola.add{background:var(--surface2);border:2px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;height:116px;color:var(--muted);font-size:12px;font-weight:700;box-shadow:none;gap:2px;transform:none!important}
.pola.add::before{display:none}
.proofs.sm .pola{width:70px}.proofs.sm .pola .cap{font-size:9.5px}.proofs.sm .pola .stk{font-size:17px}
.pola.big{width:min(260px,70vw);padding:10px 10px 14px;transform:rotate(-2deg);cursor:default}.pola.big .cap{font-size:17px;margin-top:10px}.pola.big .stk{font-size:40px;right:-14px;bottom:24px}.pola.big::before{width:70px;height:20px;top:-10px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:16px 6px;padding-top:8px}
.bcell{all:unset;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;cursor:pointer;min-width:0}
.bcell .patch{margin-bottom:10px}
.bcell b{font-size:11.5px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcell .stars{font-size:11px;letter-spacing:1px;color:#F2C14E;line-height:1}
.bprog{width:54px;height:4px;border-radius:2px;background:var(--surface2);overflow:hidden}.bprog i{display:block;height:100%;background:var(--muted)}
.patch{--bc:#555;--tc:var(--line);width:62px;height:62px;border-radius:50%;display:grid;place-items:center;position:relative;flex:none;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--bc) 70%,#fff),var(--bc) 70%);
  box-shadow:0 0 0 4px var(--tc),0 0 0 6px color-mix(in srgb,var(--tc) 40%,#000),0 4px 10px rgba(0,0,0,.35)}
.patch::after{content:"";position:absolute;inset:4px;border-radius:50%;border:2px dashed rgba(255,255,255,.55)}
.patch .pe{font-size:28px;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.patch.locked{filter:grayscale(1);opacity:.35}
.patch.big{width:120px;height:120px;margin-top:10px;box-shadow:0 0 0 7px var(--tc),0 0 0 10px color-mix(in srgb,var(--tc) 40%,#000),0 8px 20px rgba(0,0,0,.4)}.patch.big::after{inset:8px;border-width:3px}.patch.big .pe{font-size:56px}
.patch.holo{isolation:isolate;background:radial-gradient(circle at 35% 30%,#C4B5FD,#6D28D9 72%);box-shadow:0 4px 16px rgba(124,58,237,.6)}
.patch.holo::before{content:"";position:absolute;inset:-6px;border-radius:50%;z-index:-1;background:conic-gradient(from 0deg,#FF6B9A,#FFC145,#5BD4C8,#8B7CFF,#FF6B9A);animation:holo 4s linear infinite}
.patch.big.holo::before{inset:-10px}
@keyframes holo{to{transform:rotate(360deg)}}
.patch.bad::after{border-color:rgba(255,255,255,.35);border-style:dotted}
.bcell:has(.holo) .stars{color:#C4B5FD;font-size:9.5px;letter-spacing:.5px;font-weight:800}
.tdot{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:inset 0 -2px 0 rgba(0,0,0,.2)}
.pickrow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer;margin-top:6px;box-sizing:border-box}
.fxprev.sm{width:64px;height:64px;margin:0;border-radius:12px;flex:none}
.sheet-b .top-in:has(.stkchosen),.sheet-b .top-in:has(.fxbig){position:sticky;top:0;z-index:3;background:var(--bg);padding-bottom:8px}
.stkchosen{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px;background:var(--surface2);border-radius:16px;min-height:52px;align-items:center}
.stkchosen button{position:relative;border:0;background:var(--surface);border-radius:12px;width:44px;height:44px;font-size:24px}
.stkchosen i{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:var(--danger);color:#fff;font-size:10px;font-style:normal;display:grid;place-items:center}
.stkhead{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:4px 0 8px}
.stkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.stkgrid button{aspect-ratio:1;border:1px solid var(--line);background:var(--surface);border-radius:14px;font-size:24px;padding:0}
.stkgrid button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);transform:scale(.94)}
.fxbig{position:relative;height:170px;border-radius:18px;background:var(--bg);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center}
.fxbig>span{position:relative;z-index:1;color:var(--muted);font-weight:700}
.fxlabel{position:absolute;left:12px;bottom:10px;z-index:1;font-size:14px;background:color-mix(in srgb,var(--bg) 70%,transparent);padding:4px 10px;border-radius:999px}
.fxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.fxtile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;border-radius:16px;border:2px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer}
.fxtile span{font-size:28px}.fxtile b{font-size:12.5px}
.fxtile.wide{flex-direction:row;justify-content:center;gap:10px;width:100%;padding:10px}.fxtile.wide span{font-size:20px}
.fxtile[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.songcard{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;background:linear-gradient(135deg,color-mix(in srgb,#1DB954 22%,var(--surface)),var(--surface));border:1px solid var(--line)}
.sart{width:54px;height:54px;border-radius:10px;overflow:hidden;flex:none;display:grid;place-items:center;background:var(--surface2);font-size:24px;box-shadow:0 4px 12px rgba(0,0,0,.3)}.sart img{width:100%;height:100%;object-fit:cover}
.songcard .k{display:block;font-size:11px;color:var(--muted)}.songcard b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.songbtn{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:#1DB954;color:#04140A;font-size:16px;font-weight:800}
.songsp{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--surface2);color:var(--fg);text-decoration:none;font-weight:800}
.eq{display:none;gap:2px;height:12px;align-items:flex-end;margin-top:3px}.eq i{width:3px;background:#1DB954;border-radius:1px;animation:eq 0.9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}.eq i:nth-child(4){animation-delay:.1s}
.songcard.playing .eq{display:flex}@keyframes eq{0%,100%{height:3px}50%{height:12px}}
canvas.bgfx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;display:block;opacity:.8}
.fxprev canvas.bgfx,.fxbig canvas.bgfx{opacity:1}
canvas.bgfx.fixed{position:fixed}
body.has-fx .app{position:relative;z-index:1}
body.has-fx header.top{background:color-mix(in srgb,var(--bg) 55%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
body.has-fx nav.tabs{background:color-mix(in srgb,var(--surface) 70%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
body.has-fx::before{background:transparent}
#sheets .sheet>canvas.bgfx~.sheet-h,#sheets .sheet>canvas.bgfx~.sheet-b,#sheets .sheet>canvas.bgfx~.sheet-f{position:relative;z-index:1}
#sheets .sheet>canvas.bgfx~.sheet-h{background:color-mix(in srgb,var(--bg) 80%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.fxprev{position:relative;height:130px;border-radius:16px;background:var(--bg);border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;margin:6px 0 4px}
.fxprev>span{position:relative;z-index:1;font-size:12px;color:var(--muted);font-weight:700}
.crewshare{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer;box-sizing:border-box}
.crewshare>span:first-child{font-size:22px}
.crewshare .sw{flex:none;width:44px;height:26px;border-radius:999px;background:var(--surface2);position:relative;transition:background .2s}
.crewshare .sw i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .2s}
.crewshare[aria-pressed="true"] .sw{background:var(--accent)}.crewshare[aria-pressed="true"] .sw i{left:21px}
.gcard{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:20px;border:1px solid var(--line);color:var(--fg);font:inherit;cursor:pointer;box-sizing:border-box;background:var(--surface)}
.gcard.g-word{background:linear-gradient(135deg,color-mix(in srgb,#22C55E 18%,var(--surface)),var(--surface) 70%)}
.gcard.g-est{background:linear-gradient(135deg,color-mix(in srgb,#A855F7 20%,var(--surface)),var(--surface) 70%)}
.gcard.g-crunch{background:linear-gradient(135deg,color-mix(in srgb,#F59E0B 20%,var(--surface)),var(--surface) 70%)}
.gcard .ge{font-size:34px;flex:none}.gcard b{font-size:16px}
.gplay{flex:none;padding:8px 14px;border-radius:999px;background:var(--accent);color:var(--accent-fg);font-weight:800;font-size:13px}.gplay.done{background:var(--surface2);color:var(--ok);font-size:16px}
.gpl{position:relative;display:inline-flex}.gpl i{position:absolute;top:-9px;left:-3px;font-size:10px;font-style:normal;transform:rotate(-20deg)}

function localSearch(q){

  return PLACES.filter(p=>{const h=(p.name+" "+p.tags).toLowerCase();return t.every(w=>h.includes(w))}).sort((a,b)=>(b.name.toLowerCase().startsWith(t[0])?1:0)-(a.name.toLowerCase().startsWith(t[0])?1:0)).slice(0,5).map(p=>({...p,sub:"Popular spot"}));
}
let searchSeq=0;
async function onlineSearch(q){
  const seq=++searchSeq;
  const r=await fetch(`https://photon.komoot.io/api/?q=${encodeURIComponent(q)}&limit=7&lang=en&lat=25.2&lon=55.3`);
  const j=await r.json();if(seq!==searchSeq)return null;
  return(j.features||[]).map(f=>{const p=f.properties||{},[lng,lat]=f.geometry.coordinates;return{name:p.name||p.street||q,lat:+lat.toFixed(5),lng:+lng.toFixed(5),sub:[p.street&&p.housenumber?p.housenumber+" "+p.street:p.street,p.district||p.locality,p.city||p.county,p.country].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i).slice(0,3).join(", ")}}).filter(x=>x.name);
}
function parseLoc(text){
  const s=String(text||"").trim();if(!s)return null;
  let m=s.match(/@(-?\d{1,2}\.\d+),\s*(-?\d{1,3}\.\d+)/)||s.match(/!3d(-?\d{1,2}\.\d+)!4d(-?\d{1,3}\.\d+)/)||s.match(/[?&](?:q|query|ll|destination|center|daddr|sll)=(-?\d{1,2}\.\d+)(?:,|%2C)\s*(-?\d{1,3}\.\d+)/i)||s.match(/^(-?\d{1,2}\.\d{2,})\s*,\s*(-?\d{1,3}\.\d{2,})$/);
  if(!m)return null;
  return{lat:+(+m[1]).toFixed(5),lng:+(+m[2]).toFixed(5),name:nameFromLink(s)};
}
function nameFromLink(s){
  const dec=x=>{try{return decodeURIComponent(x.replace(/\+/g," "))}catch{return x}};
  let m=s.match(/\/(?:place|search)\/([^/@?]+)/);if(m&&!/^-?\d/.test(m[1]))return dec(m[1]);
  m=s.match(/[?&](?:q|query|name)=([^&]+)/i);if(m){const v=dec(m[1]);if(!/^-?\d{1,2}\.\d+,/.test(v))return v}
  return"";
}
function hav(a,b){const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dg=t(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function legEst(a,b){const km=hav(a,b)*1.3;const sp=km<12?32:km<50?65:95;return{km,min:Math.max(3,Math.round(km/sp*60+(km<12?6:4)))}}
const fMin=m=>m<60?`${m} min`:`${Math.floor(m/60)}h ${pad(m%60)}m`;
function gmapsUrl(stops){
  const p=stops.filter(s=>s.lat!=null);
  if(!p.length)return stops[0]?.link||"";
  const ll=s=>`${s.lat},${s.lng}`;
  if(p.length===1)return`https://www.google.com/maps/search/?api=1&query=${ll(p[0])}`;
  const w=p.slice(1,-1).map(ll).join("|");
  return`https://www.google.com/maps/dir/?api=1&origin=${ll(p[0])}&destination=${ll(p[p.length-1])}${w?"&waypoints="+encodeURIComponent(w):""}&travelmode=driving`;
}
const ROUTES=new Map(ls.get("yg-routes",[]));
function routeFor(stops){
  const pts=(stops||[]).filter(s=>s.lat!=null);if(pts.length<2)return null;
  const sig=pts.map(p=>(+p.lat).toFixed(5)+","+(+p.lng).toFixed(5)).join(";");const c=ROUTES.get(sig);
  if(c&&c!=="pending")return c==="fail"?null:c;
  if(!c&&navigator.onLine!==false){ROUTES.set(sig,"pending");
    fetch(`https://router.project-osrm.org/route/v1/driving/${pts.map(p=>p.lng+","+p.lat).join(";")}?overview=simplified&geometries=geojson`).then(r=>r.json()).then(j=>{
      if(j.code!=="Ok"||!j.routes?.[0])throw 0;const r=j.routes[0];
      ROUTES.set(sig,{km:r.distance/1000,min:Math.round(r.duration/60),legs:r.legs.map(l=>({km:l.distance/1000,min:Math.round(l.duration/60)})),coords:r.geometry.coordinates.map(([a,b])=>[+b.toFixed(5),+a.toFixed(5)])});
      ls.set("yg-routes",[...ROUTES].filter(([,v])=>typeof v==="object").slice(-40));schedule();
    }).catch(()=>{ROUTES.set(sig,"fail");schedule()});
  }
  return null;
}

/* Delta sync: every phone keeps its own copy of the data (IndexedDB) and only downloads documents
   created or changed since its last visit. Writes stamp a "u" (updated) time; deletes leave a small
   tombstone so other phones can drop the item. A full refresh runs every 14 days as a safety net. */
const DELTA=["plans","rsvps","media","notes","expenses","settles","busy","moments","mcomments","offers","checkins","pokes","scores"];
const FULL_EVERY=14*864e5,SKEW=5*6e4;
const IDB={_db:null,
  open(){return this._db||(this._db=new Promise((res,rej)=>{const r=indexedDB.open("yg-cache-"+ME,1);r.onupgradeneeded=()=>{r.result.createObjectStore("docs",{keyPath:"k"});r.result.createObjectStore("meta")};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async all(key){const db=await this.open();return new Promise(res=>{const out=[],tx=db.transaction("docs");tx.objectStore("docs").openCursor(IDBKeyRange.bound(key+"/",key+"/\uffff")).onsuccess=e=>{const c=e.target.result;if(c){out.push(c.value);c.continue()}else res(out)};tx.onerror=()=>res(out)})},
  async put(items){if(!items.length)return;const db=await this.open(),tx=db.transaction("docs","readwrite"),st=tx.objectStore("docs");items.forEach(x=>x.del?st.delete(x.k):st.put(x));return new Promise(r=>{tx.oncomplete=r;tx.onerror=r;tx.onabort=r})},
  async clear(key){const db=await this.open(),tx=db.transaction("docs","readwrite");tx.objectStore("docs").delete(IDBKeyRange.bound(key+"/",key+"/\uffff"));return new Promise(r=>{tx.oncomplete=r;tx.onerror=r})},
  async meta(k,v){const db=await this.open(),tx=db.transaction("meta",v===undefined?"readonly":"readwrite"),st=tx.objectStore("meta");
    if(v===undefined)return new Promise(r=>{const q=st.get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null)});st.put(v,k);return new Promise(r=>{tx.oncomplete=r;tx.onerror=r})},
  async wipe(){try{const db=await this.open();const tx=db.transaction(["docs","meta"],"readwrite");tx.objectStore("docs").clear();tx.objectStore("meta").clear();await new Promise(r=>{tx.oncomplete=r;tx.onerror=r})}catch{}}
};
async function deltaSync(path,key,apply,onErr){
  const offs=[];let map=new Map(),since=0,full=0;
  try{(await IDB.all(key)).forEach(x=>map.set(x.id,x.d));since=await IDB.meta("since:"+key)||0;full=await IDB.meta("full:"+key)||0}catch{map=new Map();since=0}
  if(map.size)apply(map);
  if(!since||now()-full>FULL_EVERY){
    const t0=now();const snap=await FS.collection(path).get();map=new Map();const items=[];
    snap.docs.forEach(d=>{const v=d.data();if(v._del)return;map.set(d.id,v);items.push({k:key+"/"+d.id,id:d.id,d:v})});
    try{await IDB.clear(key);await IDB.put(items);await IDB.meta("full:"+key,t0)}catch{}
    since=t0-SKEW;try{await IDB.meta("since:"+key,since)}catch{}
  }
  apply(map);
  let maxSeen=since;
  const onSnap=sn=>{const items=[];sn.docChanges().forEach(ch=>{if(ch.type==="removed")return;const v=ch.doc.data(),id=ch.doc.id;
      if(v._del){map.delete(id);items.push({k:key+"/"+id,del:true})}else{map.set(id,v);items.push({k:key+"/"+id,id,d:v})}
      const t=Math.max(v.u||0,v.at||0);if(t-SKEW>maxSeen)maxSeen=t-SKEW});
    if(!items.length)return;apply(map);IDB.put(items).then(()=>IDB.meta("since:"+key,maxSeen)).catch(()=>{})};
  // changes stamped with "u", plus anything newly created (also catches friends still on an older version)
  offs.push(FS.collection(path).where("u",">",since).onSnapshot(onSnap,onErr));
  offs.push(FS.collection(path).where("at",">",since).onSnapshot(onSnap,onErr));
  return()=>offs.forEach(f=>f());
}

  stop(){IDB._db=null;unsubs.splice(0).forEach(f=>f());msgSubs.forEach(f=>f());msgSubs.clear();msgData.clear();COLS.forEach(c=>D[c]=[]);D.chats=[];D.msgs=[];D.priv={labels:{}};D.wishes=[];D.mine=[];Store.ready=false},

  syncMsgSubs(){

    for(const[id,f]of msgSubs)if(!ids.has(id)){f();msgSubs.delete(id);msgData.delete(id)}

    for(const id of ids)if(!msgSubs.has(id)&&!Store.pendingChats?.has(id))Store.subMsgs(id,0);

  subMsgs(id,tries){

  path(c,id,obj){return c==="msgs"?`chats/${obj.chatId}/msgs/${id}`:c==="mine"?`mine/${ME}/items/${id}`:`${c}/${id}`},

/* ---------- person-to-person balances: mutual debts cancel out; oldest dues clear first ---------- */
function pairLedger(a,b){
  // dues a owes b and b owes a, plus payments both ways, oldest first
  const aOwes=[],bOwes=[],aPaid=[],bPaid=[];
  for(const e of D.expenses){const sh=sharesOf(e);
    if(e.paidBy===b&&sh[a])aOwes.push({e,amt:sh[a],at:e.at});
    if(e.paidBy===a&&sh[b])bOwes.push({e,amt:sh[b],at:e.at})}
  for(const p of D.settles){if(p.from===a&&p.to===b)aPaid.push(p);if(p.from===b&&p.to===a)bPaid.push(p)}
  const sum=x=>x.reduce((t,i)=>t+(+i.amt||+i.amount||0),0);
  const net=Math.round(((sum(aOwes)-sum(aPaid))-(sum(bOwes)-sum(bPaid)))*100)/100; // >0: a owes b
  const clear=(dues,pool)=>{let left=pool;return[...dues].sort((x,y)=>x.at-y.at).map(d=>{const c=Math.min(d.amt,Math.max(0,left));left-=c;return{...d,cleared:c,status:c>=d.amt-0.009?"cleared":c>0?"part":"open"}})};
  return{net,aDues:clear(aOwes,sum(bOwes)+sum(aPaid)),bDues:clear(bOwes,sum(aOwes)+sum(bPaid)),aPaid,bPaid};
}

  pts.forEach((s,i)=>{const mk=L.marker([s.lat,s.lng],{icon:pinIcon(pts.length>1?i+1:"•",color)}).addTo(layer);if(onTap)onTap(mk,s,i)});

function writeLoc(pos){
  const m=mem(ME);if(!m?.shareLoc)return;const approx=m.locMode==="approx";

const SHEETS={};

const atHome=()=>!stack.length&&UI.tab==="plans"&&UI.planFilter==="active";
function armBack(){if(!atHome()&&!history.state?.yg){try{history.pushState({yg:1},"")}catch{}}}
function openSheet(kind,args={}){
  const el=document.createElement("div");el.className="sheet"+(["photo","player","img","camera"].includes(kind)?" lightbox":"");el.setAttribute("role","dialog");el.setAttribute("aria-modal","true");
  el.innerHTML=`<div class="sheet-h wrap"><div class="in"></div></div><div class="sheet-b wrap"><div class="in top-in"></div><div class="in main-in"></div></div><div class="sheet-f wrap" hidden><div class="in"></div></div>`;
  const s={kind,args,el,state:SHEETS[kind].init?SHEETS[kind].init(args):{},parts:{}};stack.push(s);$("#sheets").appendChild(el);
  paintSheet(s,true);document.body.style.overflow="hidden";
  armBack();

}
function closeSheet(viaPop){
  const s=stack.pop();if(!s)return;s.el.remove();Object.values(s.mms||{}).forEach(m=>m.map?.remove());SHEETS[s.kind].destroy?.(s);

  if(atHome()){try{history.back()}catch{}return}

  else if(UI.tab!=="plans"){UI.tab="plans";render();window.scrollTo(0,0)}
  else if(UI.planFilter!=="active"){UI.planFilter="active";render();window.scrollTo(0,0)}

function paintSheet(s,first){
  const S=SHEETS[s.kind];const h=S.render(s);
  const parts={h:`<button class="back" data-act="close" aria-label="Back">${ICON.back}</button><h2>${h.title}</h2>${h.right||""}`,t:h.top||"",b:h.body,f:h.foot||""};
  const els={h:$(".sheet-h .in",s.el),t:$(".sheet-b .top-in",s.el),b:$(".sheet-b .main-in",s.el),f:$(".sheet-f .in",s.el)};
  els.t.hidden=!parts.t;
  $(".sheet-f",s.el).hidden=!parts.f;
  const ae=document.activeElement;const typing=ae&&s.el.contains(ae)&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  for(const k of["h","t","b","f"]){
    if(!first&&s.parts[k]===parts[k])continue;
    if(!first&&typing&&els[k].contains(ae)){s.dirty=true;continue}
    if(first)els[k].innerHTML=parts[k];else keepInputs(els[k],()=>{els[k].innerHTML=parts[k]});

  return`<div class="halo">${av}${st.map((e,i)=>{const a=(n>1?start+span*i/(n-1):270)*Math.PI/180;return`<span style="left:calc(50% + ${(Math.cos(a)*R).toFixed(1)}px);top:calc(50% + ${(Math.sin(a)*R).toFixed(1)}px);--r:${(((n>1?start+span*i/(n-1):270))+90).toFixed(0)}deg;animation-delay:${i*60}ms">${e}</span>`}).join("")}</div>`;
}

const loadI=src=>new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src});
function drawCover(g,img,x,y,w,h){const r=Math.max(w/img.naturalWidth,h/img.naturalHeight),sw=w/r,sh=h/r;g.drawImage(img,(img.naturalWidth-sw)/2,(img.naturalHeight-sh)/2,sw,sh,x,y,w,h)}
function rrect(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}
function gridCells(n,W,H,pad){const L={1:[[0,0,1,1]],2:[[0,0,.5,1],[.5,0,.5,1]],3:[[0,0,.6,1],[.6,0,.4,.5],[.6,.5,.4,.5]],4:[[0,0,.5,.5],[.5,0,.5,.5],[0,.5,.5,.5],[.5,.5,.5,.5]],5:[[0,0,.5,.55],[.5,0,.5,.55],[0,.55,1/3,.45],[1/3,.55,1/3,.45],[2/3,.55,1/3,.45]],6:[[0,0,2/3,.5],[2/3,0,1/3,.25],[2/3,.25,1/3,.25],[0,.5,1/3,.5],[1/3,.5,1/3,.5],[2/3,.5,1/3,.5]]};
  let c=L[n];if(!c){const cols=n<=9?3:4,rows=Math.ceil(n/cols);c=[];for(let i=0;i<n;i++)c.push([(i%cols)/cols,Math.floor(i/cols)/rows,1/cols,1/rows])}
  return c.map(([x,y,w,h])=>[pad+x*(W-pad*2)+pad/2,pad+y*(H-pad*2)+pad/2,w*(W-pad*2)-pad,h*(H-pad*2)-pad])}
async function makeCollage(p,items,style){
  const imgs=(await Promise.all(items.slice(0,style==="grid"?16:style==="film"?30:9).map(m=>loadI(m.kind==="video"?m.poster:m.src).catch(()=>null)))).filter(Boolean);
  const W=1080,FW=W-160,FILM_TOP=40,FILM_FOOT=200;
  const fh=imgs.map(im=>Math.round(FW*im.naturalHeight/im.naturalWidth));
  let H=style==="film"?Math.min(30000,FILM_TOP+fh.reduce((a,b)=>a+b+24,0)+FILM_FOOT):1350;
  const c=document.createElement("canvas");c.width=W;c.height=H;const g=c.getContext("2d");
  const title=`${p.emoji||""} ${p.title}`.trim(),date=p.final?fDate(p.final.date,{day:"numeric",month:"long",year:"numeric"}):"";
  if(style==="polaroid"){

    const n=imgs.length,cols=n<=2?n:n<=4?2:3,rows=Math.ceil(n/cols),cw=(W-120)/cols,ch=(H-300)/rows;
    imgs.forEach((im,i)=>{const col=i%cols,row=Math.floor(i/cols),w=Math.min(cw*.92,360+(n<=2?120:0)),h=w*1.18,cx=60+cw*col+cw/2+(Math.sin(i*7)*18),cy=110+ch*row+ch/2+(Math.cos(i*5)*14);
      g.save();g.translate(cx,cy);g.rotate((((i*37)%11)-5)*Math.PI/180);g.shadowColor="rgba(0,0,0,.28)";g.shadowBlur=26;g.shadowOffsetY=10;g.fillStyle="#fff";g.fillRect(-w/2,-h/2,w,h);g.shadowColor="transparent";
      drawCover(g,im,-w/2+16,-h/2+16,w-32,w-32);g.restore()});
    g.fillStyle="#1F2328";g.font="800 64px 'Bricolage Grotesque',system-ui,sans-serif";g.textAlign="center";g.fillText(title,W/2,H-120,W-120);
    g.font="600 34px Inter,system-ui,sans-serif";g.fillStyle="#5C6774";g.fillText([date,"Yalla Guys"].filter(Boolean).join(" · "),W/2,H-66);
  }else if(style==="film"){
    g.fillStyle="#111";g.fillRect(0,0,W,H);
    for(let y=16;y<H-FILM_FOOT+40;y+=46){g.fillStyle="#f2f2f2";rrect(g,22,y,28,26,5);g.fill();rrect(g,W-50,y,28,26,5);g.fill()}
    let y=FILM_TOP;imgs.forEach((im,i)=>{g.drawImage(im,80,y,FW,fh[i]);g.fillStyle="rgba(242,193,78,.85)";g.font="700 22px ui-monospace,Menlo,monospace";g.textAlign="left";g.fillText(String(i+1).padStart(2,"0")+"A",84,y+fh[i]+18);y+=fh[i]+24});
    g.fillStyle="#F2C14E";g.font="800 58px 'Bricolage Grotesque',system-ui,sans-serif";g.textAlign="left";g.fillText(title,80,H-104,W-160);
    g.font="600 32px Inter,system-ui,sans-serif";g.fillStyle="#ddd";g.fillText([date,"Yalla Guys"].filter(Boolean).join(" · "),80,H-60);
  }else{
    g.fillStyle="#0E1318";g.fillRect(0,0,W,H);const cells=gridCells(imgs.length,W,H-170,20);
    imgs.forEach((im,i)=>{const[x,y,w,h]=cells[i];g.save();rrect(g,x,y,w,h,22);g.clip();drawCover(g,im,x,y,w,h);g.restore()});
    g.fillStyle="#fff";g.font="800 56px 'Bricolage Grotesque',system-ui,sans-serif";g.textAlign="left";g.fillText(title,40,H-90,W-80);
    g.font="600 30px Inter,system-ui,sans-serif";g.fillStyle="#9AA4B2";g.fillText([date,"Yalla Guys"].filter(Boolean).join(" · "),40,H-44);
  }
  return new Promise(r=>c.toBlob(r,"image/jpeg",.9));
}

async function saveFiles(files){
  files=files.filter(Boolean);if(!files.length)return toast("Still loading, try again in a second.");
  try{if(navigator.canShare&&navigator.canShare({files})){await navigator.share({files});return}}catch(e){if(e?.name==="AbortError")return}

  const rs=rsvpsOf(p.id).filter(r=>r.going!=="out");

  const assigned={};for(const d of drivers)for(const u of d.riders||[])if(!assigned[u]&&riders.some(r=>r.uid===u))assigned[u]=d.uid;

function driverRoute(p,dr,info){

  let cur=pts[0]||pick[0];const ordered=[];
  while(pick.length){pick.sort((a,b)=>hav(cur,a)-hav(cur,b));cur=pick.shift();ordered.push(cur)}

function rideTimes(p,pts){
  const r=routeFor(pts),legs=[];let total=0;
  for(let i=0;i<pts.length-1;i++){const l=r?r.legs[i]:legEst(pts[i],pts[i+1]);const m=(l?.min||0)+(pts[i+1].kind==="pickup"?3:0);legs.push({km:l?.km||0,min:m});total+=m}
  let times=null;
  if(p.final?.start){const arrive=new Date(p.final.date+"T"+p.final.start).getTime();const meetIdx=pts.findIndex(x=>x.kind==="meetup");
    const endIdx=pts.length-1;let t=arrive-(pts[endIdx].kind==="meetup"?10:0)*6e4;times=new Array(pts.length);times[endIdx]=t;
    for(let i=endIdx-1;i>=0;i--){t-=legs[i].min*6e4;times[i]=t}}
  return{legs,total,times,real:!!r};
}

function edSugg(st){
  let h="";
  if(st.msg)h+=`<div class="banner" style="margin:0 0 8px">${st.msg}</div>`;

  if(st.res.length)h+=`<div class="sugg">${st.res.map((x,i)=>`<button data-act="pickRes" data-i="${i}"><b>${esc(x.name)}</b>${offerAt(x)?' <span class="ebadge">🏷️ Entertainer</span>':offersNear(x,1).length?` <span class="ebadge">🏷️ ${offersNear(x,1).length} offer${offersNear(x,1).length>1?"s":""} nearby</span>`:""}${x.sub?`<br><span class="meta">${esc(x.sub)}</span>`:""}</button>`).join("")}</div>`;
  return h;
}
function paintSugg(s){const b=$("#edSugg",s.el);if(b)b.innerHTML=edSugg(s.state)}
function addStop(s,stop,msg){
  s.state.stops.push(stop);s.state.res=[];s.state.msg=msg||"";s.state.loading=false;
  const q=$("#edQ",s.el);if(q)q.value="";q?.blur();
  paintSheet(s);toast("📍 Pinned "+(stop.name||"spot"));
}
let searchTimer=null;
async function runSearch(s,q,auto){
  s.state.loading=true;paintSugg(s);
  let res=localSearch(q);
  try{const on=await onlineSearch(q);if(on===null)return;const seen=new Set(res.map(r=>r.name.toLowerCase()));res=res.concat(on.filter(r=>!seen.has(r.name.toLowerCase())))}catch{if(!res.length)s.state.msg="Search needs internet. You can still drop a pin on the map."}
  s.state.loading=false;
  if(auto){if(res.length){const[first,...rest]=res;addStop(s,{name:first.name,lat:first.lat,lng:first.lng,addr:first.sub||"",link:auto.link||""},rest.length?"Wrong spot? Remove it and pick one below.":"");s.state.res=rest.slice(0,5);paintSugg(s)}else{s.state.msg=`Couldn't find “${esc(q)}”. Try another name or drop a pin.`;s.state.res=[];paintSugg(s)}return}
  s.state.res=res.slice(0,8);if(!res.length&&!s.state.msg)s.state.msg="No matches. Try a different spelling, or drop a pin.";paintSugg(s);
}
function handleQuery(s,raw){
  const text=raw.trim();s.state.msg="";s.state.res=[];clearTimeout(searchTimer);
  if(!text){s.state.loading=false;paintSugg(s);return}
  const url=(text.match(/https?:\/\/\S+/)||[])[0];
  if(url||/^-?\d{1,2}\.\d+\s*,\s*-?\d{1,3}\.\d+$/.test(text)){
    const p=parseLoc(text);
    if(p){addStop(s,{name:p.name||text.replace(url||"","").trim()||"Pinned spot",lat:p.lat,lng:p.lng,link:url||""});return}
    if(/instagram\.com|tiktok\.com|youtu/i.test(url)){s.state.msg="That's a post link, not a location. Add it under <b>Inspo</b> instead, and type the place name here.";paintSugg(s);return}
    const name=nameFromLink(url)||text.replace(url,"").replace(/\s+/g," ").trim();
    if(name){runSearch(s,name.slice(0,80),{link:url});return}
    s.state.msg=/goo\.gl|maps\.app/i.test(url)?"Short Google Maps links hide the location. Type the place name instead, or open the link in your browser and copy the long address from the top bar.":"That link has no location in it. Type the place name instead.";
    paintSugg(s);return;
  }
  if(text.length<2){paintSugg(s);return}
  s.state.res=localSearch(text);paintSugg(s);
  searchTimer=setTimeout(()=>runSearch(s,text),450);
}

function checkReminders(){

  for(const m of bdaysOn(TODAY())){const key="bday|"+m.id+"|"+TODAY();if(fired[key]||new Date().getHours()<8)continue;fired[key]=1;ch=true;
    notify(m.id===ME?"🎂 Happy birthday!":`🎂 It's ${m.nick}'s birthday!`,m.id===ME?"The crew hopes you have the best day 🎉":"Send them some love 🎉","bday-"+m.id,null)}
  for(const p of visiblePlans()){if(!p.final)continue;const r=myRsvp(p.id);if(!(r&&r.going!=="out")&&p.by!==ME)continue;
    const start=new Date(p.final.date+"T"+(p.final.start||"09:00")).getTime();if(now()>start)continue;
    for(const m of remindFor(p.id)){const key=`${p.id}|${p.final.date}|${p.final.start}|${m}`;if(fired[key]||now()<start-m*6e4)continue;fired[key]=1;ch=true;

      notify(`⏰ ${p.emoji||""} ${p.title}`,`${lbl}${(p.stops||[])[0]?" · "+p.stops[0].name:""}`,"rem-"+key,{kind:"plan",id:p.id})}}
  for(const b of D.busy){if(b.uid!==ME)continue;const mins=busyRemind(b.id);if(!mins.length)continue;const start=new Date(b.date+"T"+(b.start||"09:00")).getTime();if(now()>start)continue;

  if(ch)ls.set("yg-fired",fired);
}
